<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tropical Flow Radio TV</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;

      background-image:
        radial-gradient(
          circle at center,
          #160b2e 0%,
          #05020a 100%
        );

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      font-family: Arial, sans-serif;

      padding: 15px;
    }


    /* =========================================
       PLAYER PRINCIPAL
       ========================================= */

    .premium-player-dashboard {

      background: #0d081b;

      border: 1px solid rgba(
        168,
        85,
        247,
        0.4
      );

      border-radius: 24px;

      width: 100%;

      max-width: 360px;

      padding: 25px;

      box-shadow:
        0 20px 50px rgba(
          0,
          0,
          0,
          0.7
        );

      text-align: center;

      position: relative;

      overflow: hidden;
    }


    /* =========================================
       RELOJ / ESTADO
       ========================================= */

    .dashboard-top-bar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      background: rgba(
        255,
        255,
        255,
        0.03
      );

      padding: 12px;

      border-radius: 12px;

      margin-bottom: 20px;
    }


    .clock-label {

      font-size: 10px;

      color: #a855f7;

      font-weight: bold;

      display: block;
    }


    .clock-display {

      font-size: 18px;

      color: #ffffff;

      font-weight: bold;

      font-family: monospace;
    }


    .live-badge-wrapper {

      display: flex;

      align-items: center;

      gap: 8px;

      background: #000;

      padding: 6px 12px;

      border-radius: 20px;
    }


    .live-dot {

      width: 10px;

      height: 10px;

      background-color: #ef4444;

      border-radius: 50%;
    }


    .live-dot.connecting {

      background-color: #f59e0b;

      box-shadow:
        0 0 10px #f59e0b;

      animation:
        pulse 1s infinite alternate;
    }


    .live-dot.active {

      background-color: #22c55e;

      box-shadow:
        0 0 10px #22c55e;

      animation:
        pulse 1s infinite alternate;
    }


    .status-text {

      font-size: 11px;

      font-weight: bold;

      color: #9ca3af;
    }


    @keyframes pulse {

      from {
        opacity: 0.45;
      }

      to {
        opacity: 1;
      }

    }


    /* =========================================
       IDENTIDAD
       ========================================= */

    .station-hero-card {

      display: flex;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;

      text-align: left;
    }


    .brand-avatar {

      background:
        linear-gradient(
          135deg,
          #6c2bdd,
          #ec4899
        );

      width: 55px;

      height: 55px;

      min-width: 55px;

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 26px;

      box-shadow:
        0 5px 15px
        rgba(
          168,
          85,
          247,
          .25
        );
    }


    .brand-details h2 {

      margin: 0;

      font-size: 18px;

      color: #ffffff;
    }


    .sub-freq {

      margin: 3px 0 0 0;

      font-size: 12px;

      color: #a855f7;
    }


    /* =========================================
       MÉTRICAS
       ========================================= */

    .metrics-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-bottom: 20px;
    }


    .metric-box {

      background:
        rgba(
          255,
          255,
          255,
          0.02
        );

      padding: 10px;

      border-radius: 12px;
    }


    .metric-title {

      font-size: 9px;

      color: #6b7280;

      font-weight: bold;

      display: block;
    }


    .metric-value {

      font-size: 16px;

      font-weight: bold;

      color: #e5e7eb;

      font-family: monospace;
    }


    /* =========================================
       EQUALIZADOR
       ========================================= */

    .pro-equalizer {

      display: flex;

      align-items: flex-end;

      justify-content:
        space-between;

      height: 45px;

      padding: 0 10px;

      margin-bottom: 25px;

      background:
        rgba(
          0,
          0,
          0,
          0.2
        );

      border-radius: 12px;

      overflow: hidden;
    }


    .eq-bar {

      width: 5px;

      height: 10%;

      background-color: #272136;

      border-radius:
        3px 3px 0 0;
    }


    .pro-equalizer.playing
    .eq-bar {

      animation:
        bouncePro
        0.8s
        ease-in-out
        infinite
        alternate;
    }


    .pro-equalizer.playing
    .eq-bar:nth-child(2n) {

      animation-delay: 0.1s;

      background-color:
        #a855f7;
    }


    .pro-equalizer.playing
    .eq-bar:nth-child(3n) {

      animation-delay: 0.3s;

      background-color:
        #ec4899;
    }


    .pro-equalizer.playing
    .eq-bar:nth-child(4n) {

      animation-delay: 0.2s;

      background-color:
        #6c2bdd;
    }


    @keyframes bouncePro {

      0% {
        height: 10%;
      }

      100% {
        height: 95%;
      }

    }


    /* =========================================
       ÁREA PLAY
       ========================================= */

    .master-audio-controls {

      display: flex;

      justify-content: center;

      align-items: center;

      margin-top: 10px;

      margin-bottom: 5px;
    }


    .play-trigger-container {

      position: relative;

      width: 100px;

      height: 100px;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    /* =========================================
       BOTÓN VISUAL
       ========================================= */

    .master-play-btn {

      position: absolute;

      top: 15px;

      left: 15px;

      width: 70px;

      height: 70px;

      border-radius: 50%;

      border: none;

      background:
        linear-gradient(
          135deg,
          #6c2bdd,
          #a855f7
        );

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 6px 20px
        rgba(
          108,
          43,
          221,
          0.5
        ),
        0 0 25px
        rgba(
          168,
          85,
          247,
          0.15
        );

      z-index: 1;

      pointer-events: none;
    }


    .master-play-btn svg {

      width: 28px;

      height: 28px;

      fill: #ffffff;
    }


    /* =========================================
       CASTER REAL
       
       IMPORTANTE:
       NO usar opacity 0.015.
       El widget real queda sobre el
       botón y recibe directamente el clic.
       ========================================= */

    .caster-click-layer {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      z-index: 50;

      cursor: pointer;

      overflow: hidden;

      background: transparent;
    }


    /*
      El widget de Caster se mantiene
      dentro del área de clic.

      Lo hacemos ligeramente más grande
      para aumentar la posibilidad de que
      el botón PLAY real quede dentro
      de nuestra zona.
    */

    .caster-widget-holder {

      position: absolute;

      width: 100px;

      height: 100px;

      left: 0;

      top: 0;

      overflow: hidden;
    }


    .caster-widget-holder
    .cstrEmbed {

      width: 100px !important;

      min-width: 100px !important;

      max-width: 100px !important;

      margin: 0 auto !important;
    }


    /*
      Ocultamos visualmente el diseño
      del widget sin eliminarlo de la página.

      El audio y el botón siguen siendo
      propiedad de Caster.
    */

    .caster-widget-holder
    .cstrEmbed {

      opacity: 0.01;
    }


    /* =========================================
       MENSAJES
       ========================================= */

    .player-hint {

      margin-top: 10px;

      color: #77717f;

      font-size: 10px;

      letter-spacing: .4px;
    }


    .connection-message {

      min-height: 16px;

      margin-top: 5px;

      font-size: 10px;

      color: #9ca3af;
    }


    /* =========================================
       BOTÓN AUXILIAR CASTER
       ========================================= */

    .caster-direct-area {

      margin-top: 12px;

      font-size: 9px;

      color: #57505f;

      line-height: 1.4;
    }


    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 380px) {

      .premium-player-dashboard {

        padding: 20px;
      }


      .brand-details h2 {

        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <div class="premium-player-dashboard">


    <!-- ======================================
         RELOJ / ESTADO
         ====================================== -->

    <div class="dashboard-top-bar">

      <div class="system-clock-container">

        <span class="clock-label">
          ESTUDIO HORA:
        </span>

        <span
          id="studioClock"
          class="clock-display">

          00:00:00

        </span>

      </div>


      <div class="live-badge-wrapper">

        <span
          class="live-dot"
          id="liveDot">
        </span>

        <span
          id="statusText"
          class="status-text">

          LISTO

        </span>

      </div>

    </div>


    <!-- ======================================
         IDENTIDAD
         ====================================== -->

    <div class="station-hero-card">

      <div class="brand-avatar">
        🥭
      </div>


      <div class="brand-details">

        <h2>
          Tropical Flow Radio TV
        </h2>

        <p class="sub-freq">
          Señal Digital desde Puerto Rico
        </p>

      </div>

    </div>


    <!-- ======================================
         MÉTRICAS
         ====================================== -->

    <div class="metrics-grid">

      <div class="metric-box">

        <span class="metric-title">
          TIEMPO DE ESCUCHA
        </span>

        <span
          id="trackCounter"
          class="metric-value">

          00:00

        </span>

      </div>


      <div class="metric-box">

        <span class="metric-title">
          CALIDAD DE AUDIO
        </span>

        <span class="metric-value">

          96 KBPS

        </span>

      </div>

    </div>


    <!-- ======================================
         EQUALIZADOR
         ====================================== -->

    <div
      class="pro-equalizer"
      id="eqContainer">

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

      <div class="eq-bar"></div>

    </div>


    <!-- ======================================
         PLAY
         ====================================== -->

    <div class="master-audio-controls">

      <div
        class="play-trigger-container"
        id="playZone">


        <!-- BOTÓN VISUAL -->

        <button
          class="master-play-btn"
          type="button"
          aria-label="Reproducir Tropical Flow Radio TV">

          <svg
            id="playIcon"
            viewBox="0 0 24 24">

            <path d="M8 5v14l11-7z"/>

          </svg>

        </button>


        <!-- ==================================
             WIDGET OFICIAL CASTER
             ================================== -->

        <div
          class="caster-click-layer"
          id="casterClickLayer">


          <div class="caster-widget-holder">


            <div
              class="cstrEmbed"
              data-type="newStreamPlayer"
              data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d"
              data-theme="dark"
              data-color="6C2BDD"
              data-channelId=""
              data-rendered="false">


              <!--
                NO ELIMINAR ESTOS ENLACES.
                Caster requiere estos enlaces
                para cargar correctamente
                el widget.
              -->

              <a href="https://www.caster.fm">
                Shoutcast Hosting
              </a>

              <a href="https://www.caster.fm">
                Stream Hosting
              </a>

              <a href="https://www.caster.fm">
                Radio Server Hosting
              </a>


            </div>

          </div>

        </div>


      </div>

    </div>


    <!-- ======================================
         MENSAJE
         ====================================== -->

    <div class="player-hint">

      PRESIONA PLAY PARA ESCUCHAR EN VIVO

    </div>


    <div
      id="connectionMessage"
      class="connection-message">

      Radio lista — presiona PLAY

    </div>


    <div class="caster-direct-area">

      AUDIO EN VIVO • CASTER.FM

    </div>


  </div>


  <!-- ========================================
       CASTER.FM
       SCRIPT OFICIAL
       ======================================== -->

  <script
    src="https://cdn.cloud.caster.fm/widgets/embed.js">
  </script>


  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script>


    /* ======================================
       ELEMENTOS
       ====================================== */

    const playZone =
      document.getElementById(
        "playZone"
      );


    const casterLayer =
      document.getElementById(
        "casterClickLayer"
      );


    const playIcon =
      document.getElementById(
        "playIcon"
      );


    const eqContainer =
      document.getElementById(
        "eqContainer"
      );


    const liveDot =
      document.getElementById(
        "liveDot"
      );


    const statusText =
      document.getElementById(
        "statusText"
      );


    const clockElement =
      document.getElementById(
        "studioClock"
      );


    const counterElement =
      document.getElementById(
        "trackCounter"
      );


    const connectionMessage =
      document.getElementById(
        "connectionMessage"
      );


    /* ======================================
       VARIABLES
       ====================================== */

    let secondsListened = 0;

    let countInterval = null;

    let connectingTimer = null;


    /* ======================================
       RELOJ
       ====================================== */

    function updateClock() {

      const now =
        new Date();


      let h =
        now.getHours();


      const m =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );


      const s =
        String(
          now.getSeconds()
        ).padStart(
          2,
          "0"
        );


      const ampm =
        h >= 12
          ? "PM"
          : "AM";


      h =
        h % 12 || 12;


      clockElement.textContent =
        String(h).padStart(
          2,
          "0"
        )
        + ":"
        + m
        + ":"
        + s
        + " "
        + ampm;
    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


    /* ======================================
       CONTADOR
       ====================================== */

    function startCounter() {

      if (countInterval) {
        return;
      }


      countInterval =
        setInterval(
          function() {

            secondsListened++;


            const mins =
              String(
                Math.floor(
                  secondsListened /
                  60
                )
              ).padStart(
                2,
                "0"
              );


            const secs =
              String(
                secondsListened %
                60
              ).padStart(
                2,
                "0"
              );


            counterElement.textContent =
              mins
              + ":"
              + secs;

          },
          1000
        );
    }


    function stopCounter() {

      clearInterval(
        countInterval
      );

      countInterval =
        null;
    }


    /* ======================================
       ESTADO CONECTANDO
       ====================================== */

    function setConnecting() {

      liveDot.className =
        "live-dot connecting";


      statusText.textContent =
        "CONECTANDO";


      connectionMessage.textContent =
        "Conectando con Tropical Flow Radio...";


      eqContainer.classList.remove(
        "playing"
      );
    }


    /* ======================================
       ESTADO ONLINE
       ====================================== */

    function setOnline() {

      liveDot.className =
        "live-dot active";


      statusText.textContent =
        "ONLINE";


      connectionMessage.textContent =
        "🎵 Tropical Flow Radio está en vivo";


      eqContainer.classList.add(
        "playing"
      );


      playIcon.innerHTML =
        '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';


      startCounter();
    }


    /* ======================================
       ESTADO LISTO
       ====================================== */

    function setReady() {

      liveDot.className =
        "live-dot";


      statusText.textContent =
        "LISTO";


      connectionMessage.textContent =
        "Presiona PLAY para escuchar";


      eqContainer.classList.remove(
        "playing"
      );


      playIcon.innerHTML =
        '<path d="M8 5v14l11-7z"/>';


      stopCounter();
    }


    /* ======================================
       CLICK REAL
       
       MUY IMPORTANTE:
       
       Ya NO intentamos simular el
       botón de Caster.

       El click se deja pasar
       directamente al widget.
       ====================================== */

    casterLayer.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        setConnecting();


        clearTimeout(
          connectingTimer
        );


        /*
          Caster necesita un momento
          para iniciar el stream.

          No declaramos ONLINE
          inmediatamente.
        */

        connectingTimer =
          setTimeout(
            function() {

              /*
                El widget ya recibió
                el clic.

                Mostramos ONLINE
                solamente después de
                dar tiempo al reproductor.
              */

              setOnline();

            },
            2500
          );

      },
      true
    );


    /* ======================================
       EVITAR QUE EL CONTENEDOR PADRE
       INTERFIERA CON CASTER
       ====================================== */

    playZone.addEventListener(
      "click",
      function(event) {

        /*
          No hacemos play aquí.
          El reproductor Caster
          es quien controla el audio.
        */

        event.stopPropagation();

      }
    );


    /* ======================================
       CARGA DE PÁGINA
       ====================================== */

    window.addEventListener(
      "load",
      function() {

        setReady();

        connectionMessage.textContent =
          "Radio lista — presiona PLAY";

      }
    );


    /* ======================================
       SI EL USUARIO CAMBIA DE PESTAÑA
       ====================================== */

    document.addEventListener(
      "visibilitychange",
      function() {

        /*
          No detenemos el audio.
          Caster continúa controlando
          el stream.
        */

      }
    );


  </script>


</body>
</html>
