<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      background-image: radial-gradient(circle at center, #160b2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 15px;
    }

    /* =========================================
       PLAYER PRINCIPAL
       ========================================= */
    .premium-player-dashboard {
      background: #0d081b;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* =========================================
       RELOJ / ESTADO
       ========================================= */
    .dashboard-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .clock-label {
      font-size: 10px;
      color: #a855f7;
      font-weight: bold;
      display: block;
    }

    .clock-display {
      font-size: 18px;
      color: #ffffff;
      font-weight: bold;
      font-family: monospace;
    }

    .live-badge-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #000;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    .live-dot.connecting {
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    .live-dot.active {
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1s infinite alternate;
    }

    .status-text {
      font-size: 11px;
      font-weight: bold;
      color: #9ca3af;
    }

    @keyframes pulse {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    /* =========================================
       IDENTIDAD
       ========================================= */
    .station-hero-card {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .brand-avatar {
      background: linear-gradient(135deg, #6c2bdd, #ec4899);
      width: 55px;
      height: 55px;
      min-width: 55px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 5px 15px rgba(168, 85, 247, .25);
    }

    .brand-details h2 {
      margin: 0;
      font-size: 18px;
      color: #ffffff;
    }

    .sub-freq {
      margin: 3px 0 0 0;
      font-size: 12px;
      color: #a855f7;
    }

    /* =========================================
       MÉTRICAS
       ========================================= */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 12px;
    }

    .metric-title {
      font-size: 9px;
      color: #6b7280;
      font-weight: bold;
      display: block;
    }

    .metric-value {
      font-size: 16px;
      font-weight: bold;
      color: #e5e7eb;
      font-family: monospace;
    }

    /* =========================================
       EQUALIZADOR
       ========================================= */
    .pro-equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 45px;
      padding: 0 10px;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .eq-bar {
      width: 5px;
      height: 10%;
      background-color: #272136;
      border-radius: 3px 3px 0 0;
    }

    .pro-equalizer.playing .eq-bar {
      animation: bouncePro 0.8s ease-in-out infinite alternate;
    }

    .pro-equalizer.playing .eq-bar:nth-child(2n) {
      animation-delay: 0.1s;
      background-color: #a855f7;
    }

    .pro-equalizer.playing .eq-bar:nth-child(3n) {
      animation-delay: 0.3s;
      background-color: #ec4899;
    }

    .pro-equalizer.playing .eq-bar:nth-child(4n) {
      animation-delay: 0.2s;
      background-color: #6c2bdd;
    }

    @keyframes bouncePro {
      0% { height: 10%; }
      100% { height: 95%; }
    }

    /* =========================================
       ÁREA PLAY
       ========================================= */
    .master-audio-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .master-play-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6c2bdd, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(108, 43, 221, 0.5), 0 0 25px rgba(168, 85, 247, 0.15);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .master-play-btn:active {
      transform: scale(0.95);
    }

    .master-play-btn svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="premium-player-dashboard">
    <!-- BARRA SUPERIOR (Reloj y Estado) -->
    <div class="dashboard-top-bar">
      <div>
        <span class="clock-label">HORA EN VIVO</span>
        <span id="live-clock" class="clock-display">00:00:00</span>
      </div>
      <div class="live-badge-wrapper">
        <div id="dot-status" class="live-dot"></div>
        <span id="text-status" class="status-text">OFFLINE</span>
      </div>
    </div>

    <!-- IDENTIDAD DE LA ESTACIÓN -->
    <div class="station-hero-card">
      <div class="brand-avatar">📻</div>
      <div class="brand-details">
        <h2>Tropical Flow</h2>
        <p class="sub-freq">Carter FM • 96 Kbps</p>
      </div>
    </div>

    <!-- MÉTRICAS -->
    <div class="metrics-grid">
      <div class="metric-box">
        <span class="metric-title">CALIDAD</span>
        <span class="metric-value">96 kbps</span>
      </div>
      <div class="metric-box">
        <span class="metric-title">AUDIO</span>
        <span class="metric-value">MPEG</span>
      </div>
    </div>

    <!-- EQUALIZADOR -->
    <div id="equalizer" class="pro-equalizer">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div>
    </div>

    <!-- ELEMENTO DE AUDIO HTML5 SEGURO (HTTPS) con sapircast -->
    <audio id="stream-audio" preload="none">
      <source src="https://caster.fm" type="audio/mpeg">
    </audio>

    <!-- CONTROL DE PLAY/PAUSA -->
    <div class="master-audio-controls">
      <button id="play-trigger" class="master-play-btn" onclick="toggleRadio()">
        <svg id="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Sistema de reloj en vivo
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Elementos de Control de Reproducción
    const audio = document.getElementById('stream-audio');
    const playIcon = document.getElementById('play-icon');
    const dotStatus = document.getElementById('dot-status');
    const textStatus = document.getElementById('text-status');
    const equalizer = document.getElementById('equalizer');

    function toggleRadio() {
      if (audio.paused) {
        dotStatus.className = "live-dot connecting";
        textStatus.innerText = "CONECTANDO";
        
        // Carga la URL con sapircast y evita el caché agregando timestamp
        audio.src = "https://caster.fm?cb=" + new Date().getTime();
        
        audio.play().then(() => {
          dotStatus.className = "live-dot active";
          textStatus.innerText = "EN VIVO";
          equalizer.classList.add("playing");
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pausa
        }).catch(err => {
          dotStatus.className = "live-dot";
          textStatus.innerText = "ERROR";
          console.error("Error en streaming:", err);
          alert("No se pudo conectar. Verifica que la transmisión en tu panel de Caster.fm esté activa y en línea.");
        });
      } else {
        audio.pause();
        audio.src = ""; // Resetea la conexión para ahorrar datos del plan gratis
        dotStatus.className = "live-dot";
        textStatus.innerText = "OFFLINE";
        equalizer.classList.remove("playing");
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play
      }
    }
  </script>
</body>
</html>
