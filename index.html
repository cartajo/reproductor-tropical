<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090014">
<title>Tropical Flow Radio TV - Pro Player</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;width:100%;overflow-x:hidden}
body{
  background:#05020d;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color:#fff;
}

/* FASE 1: INTRO VIP ESTILO CARIBBEAN CINEMAS */
.cinema-intro-overlay{position:fixed;inset:0;z-index:9999;background:#04010a;display:flex;justify-content:center;align-items:center;overflow:hidden;user-select:none}
.curtain-panel{position:absolute;top:0;bottom:0;width:51%;z-index:2;background:repeating-linear-gradient(90deg,#1a0312 0px,#4a0728 18px,#240417 36px,#5c0a33 54px,#14020d 72px);box-shadow:inset 0 0 90px rgba(0,0,0,.92);transition:transform 1.8s cubic-bezier(.77,0,.175,1)}
.curtain-left{left:0;border-right:3px solid #d4af37;box-shadow:10px 0 40px rgba(0,0,0,.95),inset 0 0 80px rgba(0,0,0,.9)}
.curtain-right{right:0;border-left:3px solid #d4af37;box-shadow:-10px 0 40px rgba(0,0,0,.95),inset 0 0 80px rgba(0,0,0,.9)}
.cinema-valance{position:absolute;top:0;left:0;right:0;height:36px;z-index:5;background:linear-gradient(180deg,#2b0518 0%,#12020a 100%);border-bottom:3px solid #f59e0b;box-shadow:0 8px 30px rgba(0,0,0,.95),0 0 20px rgba(245,158,11,.4);transition:transform 1.4s ease,opacity 1.2s ease}
.cinema-intro-overlay.curtains-open .curtain-left{transform:translateX(-102%)}
.cinema-intro-overlay.curtains-open .curtain-right{transform:translateX(102%)}
.cinema-intro-overlay.curtains-open .cinema-valance{transform:translateY(-100%);opacity:0}
.cinema-intro-overlay.curtains-open{pointer-events:none}
.projector-beam{position:absolute;top:-10%;left:50%;transform:translateX(-50%);width:140vw;height:120vh;z-index:3;background:conic-gradient(from 162deg at 50% 0%,transparent 0deg,rgba(255,248,220,.06) 10deg,rgba(56,189,248,.16) 18deg,rgba(255,248,220,.06) 26deg,transparent 36deg);pointer-events:none;opacity:0;animation:beamFlicker 5s infinite alternate;transition:opacity .8s ease}
.cinema-intro-overlay.lights-dimmed .projector-beam{opacity:1}
@keyframes beamFlicker{0%,100%{opacity:.85}50%{opacity:1}52%{opacity:.72}54%{opacity:.95}}
.cinema-stage{position:relative;z-index:6;width:100%;max-width:780px;padding:24px;text-align:center;transition:opacity .7s ease,transform .7s ease}
.cinema-intro-overlay.curtains-open .cinema-stage{opacity:0;transform:scale(1.12)}
.ticket-card{background:linear-gradient(145deg,rgba(25,8,45,.92),rgba(10,3,20,.96));border:2px solid #f59e0b;border-radius:24px;padding:30px 22px;box-shadow:0 0 50px rgba(245,158,11,.28),inset 0 0 30px rgba(168,85,247,.2);animation:cinemaFadeUp .9s ease-out}
@keyframes cinemaFadeUp{0%{opacity:0;transform:translateY(25px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
.vip-badge{display:inline-block;padding:5px 16px;border-radius:99px;background:linear-gradient(90deg,#b45309,#f59e0b,#b45309);color:#090214;font-size:11px;font-weight:900;letter-spacing:3px;margin-bottom:14px}
.cinema-main-title{margin:0;font-size:clamp(28px,6vw,58px);font-weight:900;letter-spacing:2px;line-height:1.05;color:#fff;text-shadow:0 0 25px rgba(245,158,11,.7),0 0 50px rgba(236,72,153,.5)}
.cinema-main-title span{display:block;background:linear-gradient(90deg,#fde68a,#f59e0b,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:clamp(22px,4.5vw,44px);margin-top:6px}
.cinema-sub{color:#e9d5ff;font-size:clamp(12px,1.6vw,15px);letter-spacing:2px;margin:14px 0 26px}
.cinema-enter-btn{padding:16px 38px;font-size:clamp(13px,1.7vw,16px);font-weight:900;letter-spacing:2.5px;color:#090214;background:linear-gradient(135deg,#fde047,#f59e0b,#ec4899);border:2px solid #fff;border-radius:50px;cursor:pointer;box-shadow:0 0 30px rgba(245,158,11,.75),0 0 60px rgba(236,72,153,.45);transition:transform .25s ease}
.cinema-enter-btn:hover{transform:scale(1.06)}
.cinema-act{display:none;flex-direction:column;align-items:center;justify-content:center}
.cinema-act.active{display:flex;animation:actZoomIn .65s cubic-bezier(.16,1,.3,1) forwards}
@keyframes actZoomIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
.policy-icons{display:flex;gap:22px;font-size:34px;margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(56,189,248,.8))}
.policy-title{font-size:clamp(18px,3.5vw,30px);font-weight:900;letter-spacing:3px;color:#fde047;text-transform:uppercase;margin:0 0 8px}
.policy-desc{font-size:clamp(12px,1.8vw,16px);color:#cbd5e1;letter-spacing:1.5px;margin:0}
.reel-circle{position:relative;width:150px;height:150px;border-radius:50%;border:4px solid rgba(253,224,71,.85);box-shadow:0 0 35px rgba(245,158,11,.6),inset 0 0 25px rgba(245,158,11,.4);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(30,15,50,.9),rgba(5,2,13,.95))}
.reel-circle::before,.reel-circle::after{content:"";position:absolute;background:rgba(253,224,71,.4)}
.reel-circle::before{width:100%;height:2px;top:50%;left:0}
.reel-circle::after{width:2px;height:100%;left:50%;top:0}
.reel-sweep{position:absolute;inset:6px;border-radius:50%;border:3px dashed #38bdf8;animation:reelSpin 1s linear infinite}
@keyframes reelSpin{to{transform:rotate(360deg)}}
.reel-number{position:relative;z-index:2;font-size:74px;font-weight:900;color:#fff;text-shadow:0 0 25px #fde047}
.reel-caption{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:4px;color:#38bdf8}
.feature-kicker{font-size:clamp(12px,2vw,16px);font-weight:900;letter-spacing:6px;color:#38bdf8;margin-bottom:10px}
.feature-banner{font-size:clamp(26px,5.5vw,54px);font-weight:900;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#fff,#fde047,#f59e0b,#ec4899,#fff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 2s linear infinite}
@keyframes goldShine{to{background-position:200% center}}
.skip-cinema-btn{position:fixed;bottom:22px;right:22px;z-index:10000;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3);color:#cbd5e1;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:8px 16px;border-radius:20px;cursor:pointer}
.skip-cinema-btn:hover{background:rgba(245,158,11,.25);color:#fff;border-color:#f59e0b}

/* FASE 2: UNIVERSO ESPACIAL CON ESTRELLAS Y UFOs */
.space-universe{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 25%,#260b4d 0%,#0d041c 48%,#030108 100%);overflow:hidden;pointer-events:none}
.space-stars-layer{position:absolute;inset:-100px;background-image:radial-gradient(2.5px 2.5px at 10% 20%,#fff,transparent),radial-gradient(3px 3px at 30% 70%,#38bdf8,transparent),radial-gradient(2.5px 2.5px at 50% 15%,#fff,transparent),radial-gradient(3px 3px at 70% 80%,#ec4899,transparent),radial-gradient(2.5px 2.5px at 88% 30%,#fff,transparent),radial-gradient(3px 3px at 22% 48%,#c084fc,transparent),radial-gradient(2px 2px at 64% 52%,#fff,transparent),radial-gradient(3px 3px at 92% 85%,#38bdf8,transparent);background-size:420px 420px;animation:starsTwinkle 3.5s ease-in-out infinite alternate,starsDrift 45s linear infinite}
.space-stars-big{position:absolute;inset:-120px;background-image:radial-gradient(4px 4px at 16% 32%,#fff 30%,rgba(56,189,248,.6) 60%,transparent 100%),radial-gradient(5px 5px at 78% 22%,#fff 30%,rgba(236,72,153,.7) 60%,transparent 100%),radial-gradient(4.5px 4.5px at 84% 72%,#fff 30%,rgba(168,85,247,.7) 60%,transparent 100%),radial-gradient(4px 4px at 24% 82%,#fff 30%,rgba(56,189,248,.6) 60%,transparent 100%),radial-gradient(5px 5px at 62% 14%,#fff 30%,rgba(255,255,255,.5) 60%,transparent 100%);background-size:550px 550px;filter:drop-shadow(0 0 6px #fff);animation:bigStarsPulse 2.4s ease-in-out infinite alternate,starsDrift 30s linear infinite reverse}
@keyframes starsTwinkle{0%{opacity:.45;transform:scale(.98)}100%{opacity:1;transform:scale(1.02)}}
@keyframes bigStarsPulse{0%{opacity:.35;filter:drop-shadow(0 0 2px #38bdf8)}100%{opacity:1;filter:drop-shadow(0 0 12px #fff)}}
@keyframes starsDrift{0%{background-position:0 0}100%{background-position:420px 210px}}
.nebula-glow{position:absolute;width:50vw;height:50vw;max-width:800px;max-height:800px;min-width:280px;min-height:280px;border-radius:50%;filter:blur(95px);opacity:.38;will-change:transform;animation:nebulaFloat 14s ease-in-out infinite alternate}
.nebula-left{background:radial-gradient(circle,#9333ea,transparent 70%);top:-12%;left:-8%}
.nebula-right{background:radial-gradient(circle,#0284c7,transparent 70%);bottom:-12%;right:-8%;animation-delay:4s}
@keyframes nebulaFloat{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(5vw,-4vh,0) scale(1.15)}}
.ufo-craft{position:absolute;will-change:transform;filter:drop-shadow(0 0 18px rgba(56,189,248,.75))}
.ufo-craft svg{display:block;width:100%;height:auto;animation:ufoHover 2.8s ease-in-out infinite alternate}
@keyframes ufoHover{0%{transform:translateY(-6px) rotate(-3deg)}100%{transform:translateY(6px) rotate(3deg)}}
.ufo-1{top:12%;width:clamp(115px,11vw,175px);animation:ufoFlyRight 16s linear infinite}
.ufo-2{top:72%;width:clamp(125px,12vw,190px);filter:drop-shadow(0 0 20px rgba(236,72,153,.8));animation:ufoFlyLeft 19s linear infinite 3s}
.ufo-3{top:34%;width:clamp(80px,7.5vw,120px);opacity:.88;filter:drop-shadow(0 0 14px rgba(168,85,247,.85));animation:ufoFlyLeft 24s linear infinite 8s}
@keyframes ufoFlyRight{0%{transform:translate3d(-260px,0,0)}100%{transform:translate3d(calc(100vw + 260px),-8vh,0)}}
@keyframes ufoFlyLeft{0%{transform:translate3d(calc(100vw + 260px),0,0)}100%{transform:translate3d(-260px,7vh,0)}}

/* REPRODUCTOR PRO ORIGINAL */
.cyber-player-container{
  position:relative;z-index:5;width:100%;max-width:400px;padding:20px;
  background:linear-gradient(145deg,rgba(20,10,42,.92),rgba(7,4,18,.94));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:2px solid rgba(168,85,247,.85);border-radius:28px;
  box-shadow:0 0 25px rgba(168,85,247,.5),0 0 70px rgba(168,85,247,.22),inset 0 0 30px rgba(168,85,247,.08);
  overflow:hidden;
}
.cyber-player-container:before,.cyber-player-container:after{
  content:"";position:absolute;pointer-events:none;filter:blur(90px);opacity:.22;
}
.cyber-player-container:before{width:180px;height:180px;top:-90px;right:-70px;background:#a855f7}
.cyber-player-container:after{width:150px;height:150px;bottom:-80px;left:-70px;background:#ec4899}

/* Barra superior */
.top-status-bar{
  position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
  padding:10px 13px;border-radius:17px;margin-bottom:14px;
}
.clock-title{display:block;font-size:8px;color:#a855f7;font-weight:900;letter-spacing:1px}
.clock-num{display:block;font-family:monospace;font-size:15px;font-weight:bold;color:#fff}
.badge-live{display:flex;align-items:center;gap:7px;background:#030303;padding:7px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.05)}
.dot-signal{width:8px;height:8px;border-radius:50%;background:#ef4444}
.dot-signal.connecting{background:#f59e0b;box-shadow:0 0 12px #f59e0b;animation:neonPulse .8s infinite alternate}
.dot-signal.active{background:#10b981;box-shadow:0 0 12px #10b981;animation:neonPulse .8s infinite alternate}
.dot-signal.error{background:#ef4444;box-shadow:0 0 10px #ef4444}
.text-signal{font-size:9px;font-weight:900;color:#d1d5db;letter-spacing:.5px}
@keyframes neonPulse{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}

/* Pantalla / Logos */
.flip-screen-container{
  position:relative;z-index:2;width:100%;aspect-ratio:16 / 9;height:auto;
  perspective:1000px;margin-bottom:14px;
}
.flip-card{
  width:100%;height:100%;position:relative;
  transition:transform .85s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;
}
.flip-card.is-flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:17px;overflow:hidden;border:2px solid rgba(168,85,247,.85);
  box-shadow:0 0 18px rgba(168,85,247,.45),inset 0 0 15px rgba(0,0,0,.6);
  background:#070212;display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:0;text-align:center;
}
.flip-back{transform:rotateY(180deg)}
.brand-logo{
  display:block;width:100%;height:100%;max-width:100%;min-height:0;
  object-fit:cover;object-position:center;border-radius:0;
}
.logo-caption{
  position:absolute;left:8px;right:8px;bottom:7px;color:#ec4899;
  font-size:10px;font-weight:900;letter-spacing:1px;margin:0;
  text-shadow:0 0 10px rgba(236,72,153,.9);pointer-events:none;
}
.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(9,0,20,.78);color:#fff;border:1.5px solid rgba(168,85,247,.8);
  border-radius:50%;width:28px;height:28px;cursor:pointer;z-index:10;
  font-size:13px;display:flex;align-items:center;justify-content:center;
}
.nav-arrow:hover{background:#a855f7}
.left-arrow{left:8px}.right-arrow{right:8px}

/* Metadatos de canción */
.song-metadata-box{
  position:relative;z-index:2;background:rgba(0,0,0,.48);border:1px solid rgba(168,85,247,.35);
  border-radius:17px;padding:12px 14px;margin-bottom:12px;min-height:68px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
}
.song-title-label{font-size:9px;color:#ec4899;font-weight:900;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:5px}
.song-now-playing{font-size:13px;color:#fff;font-weight:700;line-height:1.35;word-break:break-word}
.song-now-playing.playing{text-shadow:0 0 10px rgba(236,72,153,.9);animation:songGlow 2s infinite alternate}
@keyframes songGlow{from{opacity:.85}to{opacity:1}}

/* Estadísticas: Audiencia y Calidad */
.stats-row{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat-box{background:rgba(255,255,255,.035);border:1px solid rgba(168,85,247,.2);border-radius:14px;padding:9px;text-align:center}
.stat-label{display:block;color:#8f8a9d;font-size:8px;font-weight:800;letter-spacing:.8px}
.stat-value{display:block;margin-top:3px;color:#fff;font-size:12px;font-weight:900}

/* Ecualizador visual de barras */
.wave-equalizer{
  position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;
  height:42px;padding:0 12px;margin-bottom:15px;background:rgba(0,0,0,.4);border-radius:15px;overflow:hidden;
  box-shadow:inset 0 0 12px rgba(0,0,0,.7);
}
.wave-bar{width:4px;height:12%;background:#2e1a4d;border-radius:4px 4px 0 0;transition:height .2s}
.wave-equalizer.playing .wave-bar{animation:proBounce .7s ease-in-out infinite alternate}
.wave-equalizer .wave-bar:nth-child(even){background:#ec4899;animation-duration:.5s}
.wave-equalizer .wave-bar:nth-child(3n){background:#a855f7;animation-duration:.9s}
.wave-equalizer .wave-bar:nth-child(5n){background:#3b82f6;animation-duration:.6s}
@keyframes proBounce{0%{height:15%}100%{height:95%}}

/* Botón Play */
.control-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.cyber-play-btn{
  width:76px;height:76px;border-radius:50%;border:0;background:linear-gradient(135deg,#a855f7,#6366f1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 25px rgba(168,85,247,.55),0 0 35px rgba(99,102,241,.25);color:#fff;font-size:28px;transition:transform .2s;
}
.cyber-play-btn:active{transform:scale(.95)}
.status-msg{margin-top:9px;font-size:11px;color:#c4b5fd;text-align:center;min-height:15px}

/* Volumen */
.volume-section{
  position:relative;z-index:2;display:flex;align-items:center;gap:9px;margin-bottom:14px;
  padding:9px 11px;background:rgba(255,255,255,.035);border-radius:13px;border:1px solid rgba(168,85,247,.18);
}
.volume-icon{font-size:15px}.volume-slider{flex:1;height:5px;accent-color:#a855f7;cursor:pointer;touch-action:pan-x;-webkit-appearance:auto}.volume-number{width:35px;text-align:right;color:#c4b5fd;font-size:10px;font-weight:800}

/* Panel Ecualizador 5 Bandas */
.real-eq-panel{
  position:relative;z-index:2;background:linear-gradient(145deg,rgba(20,8,40,.95),rgba(5,3,15,.95));
  border:1px solid rgba(168,85,247,.45);border-radius:17px;padding:12px 10px;margin-bottom:14px;
  box-shadow:inset 0 0 15px rgba(168,85,247,.08);
}
.real-eq-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.real-eq-title{color:#e9d5ff;font-size:10px;font-weight:900;letter-spacing:1px}
.real-eq-badge{color:#10b981;font-size:8px;font-weight:900;border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:3px 7px;background:rgba(16,185,129,.08)}
.eq-bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.eq-band{min-width:0;text-align:center;background:rgba(255,255,255,.025);border:1px solid rgba(168,85,247,.13);border-radius:10px;padding:7px 2px}
.eq-band-name{display:block;color:#c4b5fd;font-size:7.5px;font-weight:800;margin-bottom:2px}
.eq-band-frequency{display:block;color:#ec4899;font-size:8.5px;font-weight:900;margin-bottom:6px}
.eq-slider-wrap{height:84px;display:flex;align-items:center;justify-content:center}
.eq-slider{width:76px;transform:rotate(-90deg);accent-color:#ec4899;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.eq-band-value{display:block;color:#fff;font-size:8px;font-weight:800;margin-top:4px}
.eq-reset-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06)}
.eq-description{font-size:9px;color:#9ca3af}
.eq-reset-btn{background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.45);color:#e9d5ff;font-size:9px;font-weight:800;padding:4px 10px;border-radius:12px;cursor:pointer}
.eq-reset-btn:hover{background:#a855f7;color:#fff}

/* Historial y Botones */
.history-box{position:relative;z-index:2;background:rgba(0,0,0,.42);border:1px solid rgba(168,85,247,.25);border-radius:15px;padding:10px 12px;margin-bottom:13px}
.history-title{display:block;font-size:9px;font-weight:900;color:#a855f7;letter-spacing:1px;margin-bottom:6px}
.history-list{margin:0;padding-left:16px;font-size:11px;color:#d1d5db;line-height:1.45}
.history-list li{margin-bottom:3px}
.action-buttons{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action-btn{padding:11px 10px;border-radius:14px;border:1px solid rgba(168,85,247,.45);background:rgba(168,85,247,.15);color:#e9d5ff;font-size:11px;font-weight:800;cursor:pointer;transition:transform .15s,background .2s}
.action-btn.whatsapp{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.45);color:#a7f3d0}
.action-btn:active{transform:scale(.97)}

@media (max-width:420px){
  body{padding:8px}
  .cyber-player-container{padding:14px;border-radius:22px}
  .flip-screen-container{height:auto;aspect-ratio:16 / 9}
  .logo-caption{font-size:9px}
  .cyber-play-btn{width:68px;height:68px;font-size:24px}
  .eq-band-name{font-size:7px}
  .eq-slider{width:68px}
  .eq-slider-wrap{height:74px}
}
@media (min-width:900px){
  body{height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
  .cyber-player-container{transform:scale(0.84,0.63);transform-origin:center center;margin:0 auto}
}
/* ==========================================
   FASE 3: TÚNEL ESPACIAL CINEMATOGRÁFICO
========================================== */

.tf-tunnel-overlay{
  position:fixed;
  inset:0;
  z-index:9990;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:radial-gradient(circle at center,#160b35 0%,#05020e 55%,#000 100%);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity 1s ease,visibility 1s ease;
}

.tf-tunnel-overlay.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.tf-tunnel-space{
  position:absolute;
  inset:0;
  perspective:900px;
  overflow:hidden;
}

.tf-tunnel-center{
  position:absolute;
  top:50%;
  left:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#38bdf8 15%,#9333ea 40%,transparent 75%);
  box-shadow:0 0 40px #38bdf8,0 0 100px #9333ea;
  animation:tfCenterPulse 2s ease-in-out infinite alternate;
}

@keyframes tfCenterPulse{
  from{transform:translate(-50%,-50%) scale(.7);opacity:.65}
  to{transform:translate(-50%,-50%) scale(1.5);opacity:1}
}

.tf-tunnel-ring{
  position:absolute;
  top:50%;
  left:50%;
  width:100px;
  height:100px;
  border:3px solid rgba(56,189,248,.9);
  border-radius:50%;
  transform:translate(-50%,-50%) translateZ(0);
  box-shadow:
    0 0 15px #38bdf8,
    inset 0 0 15px #38bdf8,
    0 0 35px rgba(168,85,247,.9);
  animation:tfTunnelZoom 3s linear infinite;
}

.tf-tunnel-ring:nth-child(2){animation-delay:.35s;border-color:#ec4899}
.tf-tunnel-ring:nth-child(3){animation-delay:.7s;border-color:#a855f7}
.tf-tunnel-ring:nth-child(4){animation-delay:1.05s;border-color:#38bdf8}
.tf-tunnel-ring:nth-child(5){animation-delay:1.4s;border-color:#facc15}
.tf-tunnel-ring:nth-child(6){animation-delay:1.75s;border-color:#ec4899}

@keyframes tfTunnelZoom{
  0%{
    width:80px;
    height:80px;
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }
  15%{opacity:1}
  100%{
    width:150vw;
    height:150vw;
    opacity:0;
    transform:translate(-50%,-50%) scale(1.8);
  }
}

.tf-tunnel-lights{
  position:absolute;
  inset:-50%;
  background:conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(56,189,248,.25) 35deg,
    transparent 75deg,
    rgba(236,72,153,.25) 120deg,
    transparent 170deg,
    rgba(168,85,247,.3) 230deg,
    transparent 280deg,
    rgba(250,204,21,.2) 320deg,
    transparent 360deg
  );
  animation:tfLightsSpin 8s linear infinite;
  filter:blur(12px);
}

@keyframes tfLightsSpin{
  to{transform:rotate(360deg)}
}

/* PORTAL DE LUZ */

.tf-portal{
  position:absolute;
  left:50%;
  top:50%;
  width:min(65vw,420px);
  aspect-ratio:1;
  border-radius:50%;
  border:7px solid rgba(56,189,248,.9);
  transform:translate(-50%,-50%) scale(.05);
  opacity:0;
  box-shadow:
    0 0 20px #38bdf8,
    0 0 45px #9333ea,
    inset 0 0 35px #38bdf8,
    inset 0 0 70px #9333ea;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(56,189,248,.55) 15%,rgba(88,28,135,.5) 48%,rgba(0,0,0,.9) 75%);
  transition:transform 2s cubic-bezier(.16,1,.3,1),opacity 1s ease;
}

.tf-portal.portal-open{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}

.tf-portal:before{
  content:"";
  position:absolute;
  inset:-18px;
  border:3px dashed rgba(236,72,153,.9);
  border-radius:50%;
  animation:tfPortalRotate 12s linear infinite;
}

.tf-portal:after{
  content:"";
  position:absolute;
  inset:12%;
  border:2px solid rgba(250,204,21,.85);
  border-radius:50%;
  box-shadow:0 0 25px #facc15;
  animation:tfPortalRotate 7s linear infinite reverse;
}

@keyframes tfPortalRotate{
  to{transform:rotate(360deg)}
}

/* SALIDA DEL PORTAL */

.tf-tunnel-overlay.exit{
  opacity:0;
  visibility:hidden;
  transition:opacity 1.5s ease,visibility 1.5s ease;
}

.tf-player-revealed .cyber-player-container{
  animation:tfPlayerReveal 1.5s cubic-bezier(.16,1,.3,1) both;
}

@keyframes tfPlayerReveal{
  0%{
    opacity:0;
    transform:scale(.65) translateY(40px);
    filter:blur(12px);
  }
  70%{
    opacity:1;
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:scale(1) translateY(0);
    filter:blur(0);
  }
}

.tf-tunnel-message{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  top:12%;
  text-align:center;
  padding:0 15px;
  color:#fff;
  font-size:clamp(13px,3vw,22px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 0 15px #38bdf8,0 0 30px #9333ea;
  animation:tfMessageGlow 2s ease-in-out infinite alternate;
}

@keyframes tfMessageGlow{
  from{opacity:.65;text-shadow:0 0 10px #38bdf8}
  to{opacity:1;text-shadow:0 0 25px #38bdf8,0 0 45px #ec4899}
}

/* AJUSTES PARA PANTALLAS PEQUEÑAS */

@media(max-width:600px){
  .tf-portal{width:75vw}
  .tf-tunnel-message{letter-spacing:2px;top:15%}
}

/* FIN DE LOS ESTILOS ESPACIALES */
</style>
</head>

<style>
/* ==========================================
   PARTE 4: ANIMACIÓN DE LA MISIÓN ESPACIAL
========================================== */

.tf-space-mission{
  position:relative;
  width:100%;
  min-height:440px;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 50% 50%,#172554 0%,#09051d 48%,#02010a 100%);
}

.tf-space-stars{
  position:absolute;
  inset:0;
  opacity:.8;
  background-image:
    radial-gradient(2px 2px at 12% 22%,#fff 99%,transparent),
    radial-gradient(1px 1px at 35% 68%,#fff 99%,transparent),
    radial-gradient(2px 2px at 72% 18%,#fff 99%,transparent),
    radial-gradient(1px 1px at 88% 72%,#fff 99%,transparent),
    radial-gradient(2px 2px at 52% 42%,#fff 99%,transparent),
    radial-gradient(1px 1px at 22% 85%,#fff 99%,transparent),
    radial-gradient(2px 2px at 93% 34%,#fff 99%,transparent);
  background-size:300px 220px;
  animation:tfStarDrift 35s linear infinite;
}

@keyframes tfStarDrift{
  from{transform:translateY(0)}
  to{transform:translateY(-220px)}
}

.tf-mission-tag{
  position:absolute;
  z-index:5;
  top:18px;
  left:0;
  right:0;
  text-align:center;
  color:#e0f2fe;
  font-size:clamp(11px,2vw,16px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 0 12px #38bdf8;
}

.tf-earth-wrap{

  width:clamp(190px,35vw,330px);
  aspect-ratio:1;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
}

.tf-earth-glow{
  position:absolute;
  inset:-18%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.34),transparent 68%);
  animation:tfEarthGlow 4s ease-in-out infinite alternate;
}

.tf-earth{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:50%;
  border:2px solid rgba(147,197,253,.8);
  background:
    radial-gradient(ellipse at 28% 35%,rgba(34,197,94,.95) 0 9%,transparent 10%),
    radial-gradient(ellipse at 60% 62%,rgba(22,163,74,.95) 0 12%,transparent 13%),
    radial-gradient(ellipse at 72% 27%,rgba(34,197,94,.9) 0 8%,transparent 9%),
    radial-gradient(ellipse at 40% 75%,rgba(21,128,61,.9) 0 8%,transparent 9%),
    linear-gradient(145deg,#7dd3fc,#075985 48%,#082f49);
  box-shadow:
    inset -25px -10px 45px rgba(0,0,0,.75),
    inset 10px 5px 25px rgba(255,255,255,.35),

  .tf-earth,
  .tf-earth-glow,
  .tf-ship-pr,
  .tf-ship-flow{
    animation:none!important;

</style>
<script>
/* ==========================================
   PARTE 5: SECUENCIA DE ENTRADA TROPICAL FLOW
========================================== */

(function(){

  const cinema = document.getElementById("cinemaIntro");
  const enterButton = document.getElementById("cinemaEnterBtn");
  const skipButton = document.getElementById("skipCinemaBtn");
  const welcome = document.getElementById("cinemaWelcome");
  const feature = document.getElementById("cinemaFeature");

  const tunnel = document.getElementById("tfTunnelOverlay");
  const portal = document.getElementById("tfPortal");

  if(!cinema || !tunnel || !portal){
    console.warn("Tropical Flow: faltan elementos de la entrada espacial.");
    return;
  }

  let sequenceStarted = false;
  let timers = [];

  function wait(callback, milliseconds){
    const timer = setTimeout(callback,milliseconds);
    timers.push(timer);
  }

  function revealPlayer(){

    tunnel.classList.remove("active");
    tunnel.classList.add("exit");

    document.body.classList.add("tf-player-revealed");

    wait(function(){
      tunnel.classList.remove("exit");
      cinema.style.display = "none";
    },1600);

  }

  function startSpaceSequence(){

    if(sequenceStarted) return;
    sequenceStarted = true;

    if(welcome) welcome.classList.remove("active");
    if(feature) feature.classList.add("active");

    cinema.classList.add("cinema-finished");

    wait(function(){

      cinema.style.display = "none";

      tunnel.classList.add("active");

      wait(function(){
        portal.classList.add("portal-open");
      },900);

      wait(function(){
        revealPlayer();
      },4200);

    },1200);

  }

  if(enterButton){
    enterButton.addEventListener("click",startSpaceSequence);
  }

  if(skipButton){
    skipButton.addEventListener("click",startSpaceSequence);
  }

  /* Evita que el portal quede abierto si el usuario
     vuelve a iniciar la secuencia desde la página. */

  window.addEventListener("pageshow",function(){
    portal.classList.remove("portal-open");
    tunnel.classList.remove("active","exit");
    document.body.classList.remove("tf-player-revealed");
  });

})();
</script>
<!-- ======================================
     CIERRE FINAL TROPICAL FLOW RADIO TV
====================================== -->

</body>
</html>
