<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #05020a;
      background-image: radial-gradient(circle at center, #160b2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .premium-player-dashboard {
      background: #0d081b;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      text-align: center;
    }
    .dashboard-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .clock-label { font-size: 10px; color: #a855f7; font-weight: bold; display: block; }
    .clock-display { font-size: 18px; color: #ffffff; font-weight: bold; font-family: monospace; }
    .station-hero-card { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
    .brand-avatar { background: linear-gradient(135deg, #6c2bdd, #ec4899); width: 55px; height: 55px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .brand-details h2 { margin: 0; font-size: 18px; color: #ffffff; }
    .sub-freq { margin: 2px 0 0 0; font-size: 12px; color: #a855f7; }

         .caster-container-fixed {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 15px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="premium-player-dashboard">
  <div class="dashboard-top-bar">
    <div class="system-clock-container">
      <span class="clock-label">ESTUDIO HORA:</span>
      <span id="studioClock" class="clock-display">00:00:00</span>
    </div>
    <div class="live-badge-wrapper" style="color: #22c55e; font-weight: bold; font-size: 12px; letter-spacing: 1px;">
      RADIO DIGITAL
    </div>
  </div>

  <div class="station-hero-card">
    <div class="brand-avatar">🥭</div>
    <div class="brand-details">
      <h2>Tropical Flow Radio TV</h2>
      <p class="sub-freq">Señal desde Puerto Rico</p>
    </div>
  </div>

  <!-- REPRODUCTOR OFICIAL VISIBLE (Garantiza el paso de las restricciones de audio) -->
  <div class="caster-container-fixed">
    <div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" data-theme="dark" data-color="6C2BDD" data-channelId="" data-rendered="false"></div>
    <script src="https://caster.fm"></script>
  </div>
</div>

<script>
  const clockElement = document.getElementById('studioClock');

  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clockElement.textContent = h.toString().padStart(2, '0') + ":" + m + ":" + s + " " + ampm;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>
</html>
