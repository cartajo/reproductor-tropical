<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV</title>

  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #05020a;
      background-image: radial-gradient(circle at center, #160b2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 15px;
    }

    .premium-player-dashboard {
      background: #0d081b;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .dashboard-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .clock-label { font-size: 10px; color: #a855f7; font-weight: bold; display: block; }
    .clock-display { font-size: 18px; color: #ffffff; font-weight: bold; font-family: monospace; }

    .live-badge-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #000;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .live-dot { width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
    .status-text { font-size: 11px; font-weight: bold; color: #22c55e; }

    .station-hero-card {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .brand-avatar {
      background: linear-gradient(135deg, #6c2bdd, #ec4899);
      width: 55px; height: 55px; min-width: 55px;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 5px 15px rgba(168, 85, 247, .25);
    }

    .brand-details h2 { margin: 0; font-size: 18px; color: #ffffff; }
    .sub-freq { margin: 3px 0 0 0; font-size: 12px; color: #a855f7; }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-box { background: rgba(255, 255, 255, 0.02); padding: 10px; border-radius: 12px; }
    .metric-title { font-size: 9px; color: #6b7280; font-weight: bold; display: block; }
    .metric-value { font-size: 16px; font-weight: bold; color: #e5e7eb; font-family: monospace; }

    /* CONTENEDOR DE CASTER.FM OFICIAL */
    .caster-embed-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 16px;
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="premium-player-dashboard">
    <!-- BARRA SUPERIOR -->
    <div class="dashboard-top-bar">
      <div>
        <span class="clock-label">HORA EN VIVO</span>
        <span id="live-clock" class="clock-display">00:00:00</span>
      </div>
      <div class="live-badge-wrapper">
        <div class="live-dot"></div>
        <span class="status-text">EN LÍNEA</span>
      </div>
    </div>

    <!-- IDENTIDAD DE LA ESTACIÓN -->
    <div class="station-hero-card">
      <div class="brand-avatar">📻</div>
      <div class="brand-details">
        <h2>Tropical Flow</h2>
        <p class="sub-freq">Carter FM • 96 Kbps</p>
      </div>
    </div>

    <!-- MÉTRICAS -->
    <div class="metrics-grid">
      <div class="metric-box">
        <span class="metric-title">SERVIDOR</span>
        <span class="metric-value" style="font-size: 11px;">sapircast</span>
      </div>
      <div class="metric-box">
        <span class="metric-title">MONTAJE</span>
        <span class="metric-value">/kidAJ</span>
      </div>
    </div>

    <!-- REPRODUCTOR OFICIAL EMBEBIDO DE CASTER.FM -->
    <div class="caster-embed-box">
      <iframe src="https://caster.fm" width="100%" height="60" scrolling="no" frameborder="0"></iframe>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
