<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Flow Radio TV</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #00695c, #ff9800);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .player {
            width: 350px;
            padding: 25px;
            border-radius: 25px;
            background: #111111; /* Fondo sólido oscuro para asegurar contraste total con el widget */
            color: white;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .reloj {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            color: #ff9800;
            letter-spacing: 1px;
        }

        .live {
            margin: 15px 0;
            color: #ff3333;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            animation: parpadeo 1.5s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* CORRECCIÓN CRÍTICA DE VISIBILIDAD PARA EL REPRODUCTOR CASTER */
        .contenedor-caster {
            margin-top: 20px;
            width: 100%;
            height: 140px; /* Espacio exacto requerido por el iframe de Caster */
            overflow: hidden;
            background: #222222;
            border-radius: 15px;
            border: 1px solid #333333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cstrEmbed, .cstrEmbed iframe {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }

        /* Oculta los enlaces de texto redundantes del widget */
        .cstrEmbed a {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="player">
        <div class="logo">
            🌴 Tropical Flow<br>
            📻 Radio TV
        </div>
        
        <!-- Reloj Digital Formato de 12 Horas -->
        <div class="reloj" id="reloj">--:--:-- --</div>

        <div class="live">🔴 EN VIVO</div>
        
        <!-- Contenedor Forzado para Widget de Caster.fm -->
        <div class="contenedor-caster">
            <div class="cstrEmbed" 
                 data-type="newStreamPlayer" 
                 data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" 
                 data-theme="dark" 
                 data-color="ff9800" 
                 data-channelId="" 
                 data-rendered="false">
                 <a href="https://www.caster.fm">Shoutcast Hosting</a>
            </div>
        </div>
    </div>

    <!-- Script Oficial de Caster -->
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

    <script>
        // SOLUCIÓN AL RELOJ MILITAR (Usa el formato regional estándar de 12 horas)
        function actualizarReloj() {
            const fecha = new Date();
            document.getElementById('reloj').innerHTML = fecha.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        // Ejecución en tiempo real
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>

</body>
</html>
