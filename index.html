<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Flow Radio TV - Pro Player</title>
    
    <!-- Conexión con el archivo manifest de la App -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* Fondo con la imagen de tu marca Tropical Flow */
        body {
            margin: 0;
            padding: 0;
            background: url('fondo.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* La tarjeta del reproductor estilo App */
        .player-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(29, 2, 54, 0.95) 0%, rgba(12, 0, 23, 0.95) 100%);
            border: 2px solid #00f0ff; /* Borde neón azul */
            border-radius: 28px;
            padding: 30px 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0px 15px 35px rgba(0, 240, 255, 0.3);
            margin: 15px;
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin: 0 0 5px 0;
            color: #00f0ff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .sub-title {
            font-size: 14px;
            color: #e0aaff;
            margin: 0 0 25px 0;
            letter-spacing: 0.5px;
        }

        /* Botón de Estación Activa */
        .status-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(58, 12, 163, 0.6);
            border: 1px solid #7209b7;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff66;
        }

        /* El recuadro donde carga tu reproductor de Caster */
        .stream-player-area {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .stream-player-area iframe {
            width: 100%;
            height: 160px; /* Tamaño ideal para que cargue tu player de Caster */
            border: none;
            border-radius: 14px;
        }

        .now-playing {
            font-size: 11px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .track-title {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin: 0 0 25px 0;
        }

        /* Botón dinámico para instalar la App */
        .install-btn {
            display: none; /* Solo se activa en celulares compatibles */
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 5px 20px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }

        .install-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h1 class="header-title">Tropical Flow</h1>
        <p class="sub-title">Señal Digital desde Puerto Rico</p>

        <div class="status-badge">
            <span class="status-dot"></span>ESTACIÓN ACTIVA
        </div>

        <div class="stream-player-area">
            <!-- Aquí corre tu señal real de Caster.fm -->
            <iframe src="https://github.io" allow="autoplay; encrypted-media"></iframe>
        </div>

        <div class="now-playing">🎵 Sonando Ahora</div>
        <p class="track-title">Audio en Vivo • Tropical Flow Radio TV</p>

        <!-- Botón de instalación automática -->
        <button id="btnInstall" class="install-btn">📲 Instalar App</button>
    </div>

    <!-- Script inteligente de instalación -->
    <script>
        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'block'; 
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                btnInstall.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            btnInstall.style.display = 'none';
        });
    </script>
</body>
</html>
