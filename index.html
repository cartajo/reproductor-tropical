<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Flow Radio Tv</title>
    <style>
        body {
            margin: 0;
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e1e24;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            font-size: 45px;
            margin-bottom: 5px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin: 5px 0;
        }
        .slogan {
            color: #a0a0aa;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        /* Reloj Digital Funcional */
        .clock-box {
            background: rgba(108, 43, 221, 0.15);
            color: #bfa3ff;
            border: 1px solid rgba(108, 43, 221, 0.4);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-family: monospace;
        }

        /* Contenedor del Reproductor de Caster */
        .caster-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo">🥭🦩</div>
        <div class="title">Tropical Flow Radio Tv</div>
        <div class="slogan">Energía Caribeña desde Puerto Rico</div>
        
        <!-- Reloj Digital Activo -->
        <div class="clock-box" id="liveClock">00:00:00 AM</div>

        <!-- REPRODUCTOR OFICIAL INTEGRADO (Sin bloqueos) -->
        <div class="caster-container">
            <div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" data-theme="dark" data-color="6C2BDD" data-channelId="" data-rendered="false">
                <a href="https://caster.fm">Radio Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

    <script>
        // Sistema del Reloj en Vivo (Formato 12 Horas)
        function runClock() {
            const time = new Date();
            let hrs = time.getHours();
            const mins = String(time.getMinutes()).padStart(2, '0');
            const secs = String(time.getSeconds()).padStart(2, '0');
            const ampm = hrs >= 12 ? 'PM' : 'AM';
            
            hrs = hrs % 12 || 12;
            const finalHrs = String(hrs).padStart(2, '0');

            document.getElementById('liveClock').innerText = `${finalHrs}:${mins}:${secs} ${ampm}`;
        }
        
        // Iniciar reloj
        runClock();
        setInterval(runClock, 1000);
    </script>
</body>
</html>
