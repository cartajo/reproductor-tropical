<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #05020a;
      background-image:
        radial-gradient(circle at center, #160b2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 15px;
    }

    .premium-player-dashboard {
      background: #0d081b;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .dashboard-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .clock-label {
      font-size: 10px;
      color: #a855f7;
      font-weight: bold;
      display: block;
    }

    .clock-display {
      font-size: 18px;
      color: #ffffff;
      font-weight: bold;
      font-family: monospace;
    }

    .live-badge-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #000;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    .live-dot.connecting {
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    .live-dot.active {
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1s infinite alternate;
    }

    .status-text {
      font-size: 11px;
      font-weight: bold;
      color: #9ca3af;
    }

    @keyframes pulse {
      from {
        opacity: 0.45;
      }

      to {
        opacity: 1;
      }
    }

    .station-hero-card {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .brand-avatar {
      background: linear-gradient(135deg, #6c2bdd, #ec4899);
      width: 55px;
      height: 55px;
      min-width: 55px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 5px 15px rgba(168,85,247,.25);
    }

    .brand-details h2 {
      margin: 0;
      font-size: 18px;
      color: #ffffff;
    }

    .sub-freq {
      margin: 3px 0 0 0;
      font-size: 12px;
      color: #a855f7;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 12px;
    }

    .metric-title {
      font-size: 9px;
      color: #6b7280;
      font-weight: bold;
      display: block;
    }

    .metric-value {
      font-size: 16px;
      font-weight: bold;
      color: #e5e7eb;
      font-family: monospace;
    }

    .pro-equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 45px;
      padding: 0 10px;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .eq-bar {
      width: 5px;
      height: 10%;
      background-color: #272136;
      border-radius: 3px 3px 0 0;
    }

    .pro-equalizer.playing .eq-bar {
      animation: bouncePro 0.8s ease-in-out infinite alternate;
    }

    .pro-equalizer.playing .eq-bar:nth-child(2n) {
      animation-delay: 0.1s;
      background-color: #a855f7;
    }

    .pro-equalizer.playing .eq-bar:nth-child(3n) {
      animation-delay: 0.3s;
      background-color: #ec4899;
    }

    .pro-equalizer.playing .eq-bar:nth-child(4n) {
      animation-delay: 0.2s;
      background-color: #6c2bdd;
    }

    @keyframes bouncePro {
      0% {
        height: 10%;
      }

      100% {
        height: 95%;
      }
    }

    /* =========================
       BOTÓN PRINCIPAL
       ========================= */

    .master-audio-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .play-trigger-container {
      position: relative;
      width: 90px;
      height: 90px;
    }

    /* Nuestro botón visual */
    .master-play-btn {
      position: absolute;
      top: 10px;
      left: 10px;

      background: linear-gradient(135deg, #6c2bdd, #a855f7);
      border: none;

      width: 70px;
      height: 70px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 6px 20px rgba(108, 43, 221, 0.5),
        0 0 25px rgba(168, 85, 247, 0.15);

      z-index: 1;

      pointer-events: none;
    }

    .master-play-btn svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    /* =========================
       CASTER OFICIAL
       ========================= */

    .caster-click-layer {
      position: absolute;
      top: 0;
      left: 0;

      width: 90px;
      height: 90px;

      overflow: hidden;

      z-index: 20;

      opacity: 0.015;

      cursor: pointer;
    }

    /*
      El widget de Caster es más grande.
      Lo reducimos para que su botón PLAY
      quede aproximadamente dentro de nuestro
      botón morado.
    */

    .caster-widget-scale {
      position: absolute;

      width: 360px;
      height: 360px;

      left: -135px;
      top: -135px;

      transform: scale(0.25);
      transform-origin: center center;
    }

    .caster-widget-scale .cstrEmbed {
      width: 360px !important;
      min-width: 360px !important;
    }

    /* Texto pequeño debajo */
    .player-hint {
      margin-top: 10px;
      color: #77717f;
      font-size: 10px;
      letter-spacing: .4px;
    }

    .connection-message {
      min-height: 16px;
      margin-top: 5px;
      font-size: 10px;
      color: #9ca3af;
    }

    @media (max-width: 380px) {
      .premium-player-dashboard {
        padding: 20px;
      }

      .brand-details h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="premium-player-dashboard">

    <!-- =========================
         RELOJ / ESTADO
         ========================= -->

    <div class="dashboard-top-bar">

      <div class="system-clock-container">
        <span class="clock-label">ESTUDIO HORA:</span>
        <span id="studioClock" class="clock-display">
          00:00:00
        </span>
      </div>

      <div class="live-badge-wrapper">

        <span
          class="live-dot"
          id="liveDot">
        </span>

        <span
          id="statusText"
          class="status-text">
          LISTO
        </span>

      </div>

    </div>


    <!-- =========================
         IDENTIDAD DE LA RADIO
         ========================= -->

    <div class="station-hero-card">

      <div class="brand-avatar">
        🥭
      </div>

      <div class="brand-details">

        <h2>
          Tropical Flow Radio TV
        </h2>

        <p class="sub-freq">
          Señal Digital desde Puerto Rico
        </p>

      </div>

    </div>


    <!-- =========================
         MÉTRICAS
         ========================= -->

    <div class="metrics-grid">

      <div class="metric-box">

        <span class="metric-title">
          TIEMPO DE ESCUCHA
        </span>

        <span
          id="trackCounter"
          class="metric-value">
          00:00
        </span>

      </div>


      <div class="metric-box">

        <span class="metric-title">
          CALIDAD DE AUDIO
        </span>

        <span class="metric-value">
          96 KBPS
        </span>

      </div>

    </div>


    <!-- =========================
         EQUALIZADOR
         ========================= -->

    <div
      class="pro-equalizer"
      id="eqContainer">

      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>

    </div>


    <!-- =========================
         BOTÓN PLAY
         ========================= -->

    <div class="master-audio-controls">

      <div
        class="play-trigger-container"
        id="playZone">

        <!-- BOTÓN VISUAL -->

        <button
          class="master-play-btn"
          type="button"
          aria-label="Reproducir Tropical Flow Radio TV">

          <svg
            id="playIcon"
            viewBox="0 0 24 24">

            <path d="M8 5v14l11-7z"/>

          </svg>

        </button>


        <!-- =========================
             WIDGET REAL DE CASTER
             ========================= -->

        <div class="caster-click-layer">

          <div class="caster-widget-scale">

            <div
              class="cstrEmbed"
              data-type="newStreamPlayer"
              data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d"
              data-theme="dark"
              data-color="6C2BDD"
              data-channelId=""
              data-rendered="false">

              <!--
                Caster requiere estos enlaces
                para cargar correctamente el widget.
              -->

              <a href="https://www.caster.fm">
                Shoutcast Hosting
              </a>

              <a href="https://www.caster.fm">
                Stream Hosting
              </a>

              <a href="https://www.caster.fm">
                Radio Server Hosting
              </a>

            </div>

          </div>

        </div>

      </div>

    </div>


    <div class="player-hint">
      PRESIONA PLAY PARA ESCUCHAR EN VIVO
    </div>

    <div
      id="connectionMessage"
      class="connection-message">
      Preparando señal de radio...
    </div>

  </div>


  <!-- ==================================================
       CASTER.FM — SCRIPT OFICIAL DEL WIDGET
       ================================================== -->

  <script
    src="https://cdn.cloud.caster.fm/widgets/embed.js">
  </script>


  <!-- ==================================================
       JAVASCRIPT DEL PLAYER
       ================================================== -->

  <script>

    /* =========================
       ELEMENTOS
       ========================= */

    const playZone =
      document.getElementById("playZone");

    const playIcon =
      document.getElementById("playIcon");

    const eqContainer =
      document.getElementById("eqContainer");

    const liveDot =
      document.getElementById("liveDot");

    const statusText =
      document.getElementById("statusText");

    const clockElement =
      document.getElementById("studioClock");

    const counterElement =
      document.getElementById("trackCounter");

    const connectionMessage =
      document.getElementById("connectionMessage");


    /* =========================
       VARIABLES
       ========================= */

    let secondsListened = 0;

    let countInterval = null;

    let isPlaying = false;


    /* =========================
       RELOJ
       ========================= */

    function updateClock() {

      const now = new Date();

      let h = now.getHours();

      const m =
        String(now.getMinutes())
        .padStart(2, "0");

      const s =
        String(now.getSeconds())
        .padStart(2, "0");

      const ampm =
        h >= 12 ? "PM" : "AM";

      h =
        h % 12 || 12;

      clockElement.textContent =
        h.toString().padStart(2, "0")
        + ":"
        + m
        + ":"
        + s
        + " "
        + ampm;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /* =========================
       CONTADOR
       ========================= */

    function startCounter() {

      clearInterval(countInterval);

      countInterval =
        setInterval(() => {

          secondsListened++;

          const mins =
            String(
              Math.floor(
                secondsListened / 60
              )
            ).padStart(2, "0");

          const secs =
            String(
              secondsListened % 60
            ).padStart(2, "0");

          counterElement.textContent =
            mins + ":" + secs;

        }, 1000);
    }


    function stopCounter() {

      clearInterval(countInterval);

      countInterval = null;
    }


    /* =========================
       ESTADO: CONECTANDO
       ========================= */

    function setConnecting() {

      liveDot.className =
        "live-dot connecting";

      statusText.textContent =
        "CONECTANDO";

      connectionMessage.textContent =
        "Conectando con Tropical Flow Radio...";

      eqContainer.classList.remove(
        "playing"
      );
    }


    /* =========================
       ESTADO: ONLINE
       ========================= */

    function setOnline() {

      isPlaying = true;

      liveDot.className =
        "live-dot active";

      statusText.textContent =
        "ONLINE";

      connectionMessage.textContent =
        "🎵 Tropical Flow Radio está en vivo";

      eqContainer.classList.add(
        "playing"
      );

      playIcon.innerHTML =
        '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

      startCounter();
    }


    /* =========================
       ESTADO: OFFLINE
       ========================= */

    function setOffline() {

      isPlaying = false;

      liveDot.className =
        "live-dot";

      statusText.textContent =
        "LISTO";

      connectionMessage.textContent =
        "Presiona PLAY para escuchar";

      eqContainer.classList.remove(
        "playing"
      );

      playIcon.innerHTML =
        '<path d="M8 5v14l11-7z"/>';

      stopCounter();
    }


    /* =========================
       CLICK DEL PLAYER
       =========================

       IMPORTANTE:

       Nuestro botón visual tiene
       pointer-events:none.

       El click pasa al widget
       oficial de Caster.

    */

    playZone.addEventListener(
      "click",
      function() {

        if (!isPlaying) {

          setConnecting();

          /*
             Damos unos segundos para
             que Caster inicie su audio.
          */

          setTimeout(
            function() {

              /*
                 El widget oficial de Caster
                 ya recibió el click.
                 Activamos la interfaz visual.
              */

              setOnline();

            },
            1200
          );

        } else {

          setOffline();

        }

      }
    );


    /* =========================
       SEGURIDAD
       ========================= */

    window.addEventListener(
      "load",
      function() {

        connectionMessage.textContent =
          "Radio lista — presiona PLAY";

      }
    );

  </script>

</body>
</html>
