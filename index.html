<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV - Pro Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #06040d;
      background-image: radial-gradient(circle at center, #1b0d3a 0%, #06040d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 15px;
    }

    /* ================================
       CONTENEDOR PRINCIPAL
    ================================= */
    .cyber-player-container {
      background: rgba(13, 8, 28, 0.95);
      border: 2px solid #a855f7;
      border-radius: 30px;
      width: 100%;
      max-width: 350px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* ================================
       BARRA SUPERIOR
    ================================= */
    .top-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 15px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .clock-title {
      font-size: 9px;
      color: #a855f7;
      font-weight: 800;
      display: block;
    }

    .clock-num {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
      font-family: monospace;
    }

    /* ================================
       BADGE LIVE
    ================================= */
    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #000;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .dot-signal {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .dot-signal.active {
      background-color: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: neonPulse 0.8s infinite alternate;
    }

    .text-signal {
      font-size: 10px;
      font-weight: 900;
      color: #9ca3af;
    }

    @keyframes neonPulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* ================================
       IDENTIDAD DE MARCA
    ================================= */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .brand-glow-icon {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
      animation: floatIcon 3s ease-in-out infinite alternate;
    }

    .brand-info h2 {
      margin: 0;
      font-size: 20px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .brand-info p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #a855f7;
      font-weight: 600;
    }

    @keyframes floatIcon {
      from { transform: translateY(0px); }
      to { transform: translateY(-4px); }
    }

    /* ================================
       CANCIÓN ACTUAL (METADATOS)
    ================================= */
    .song-metadata-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 20px;
      min-height: 65px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .song-title-label {
      font-size: 10px;
      color: #ec4899;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .song-now-playing {
      font-size: 13px;
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================================
       ECUALIZADOR DINÁMICO
    ================================= */
    .wave-equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 50px;
      padding: 0 15px;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 15px;
      overflow: hidden;
    }

    .wave-bar {
      width: 4px;
      height: 15%;
      background-color: #2e1a4d;
      border-radius: 3px 3px 0 0;
      transition: height 0.2s ease;
    }

    .playing .wave-bar {
      animation: proBounce 0.7s ease-in-out infinite alternate;
    }

    .playing .wave-bar:nth-child(even) { background-color: #ec4899; animation-duration: 0.5s; }
    .playing .wave-bar:nth-child(3n) { background-color: #a855f7; animation-duration: 0.9s; }
    .playing .wave-bar:nth-child(5n) { background-color: #3b82f6; animation-duration: 0.6s; }

    @keyframes proBounce {
      0% { height: 15%; }
      100% { height: 95%; }
    }

    /* ================================
       BOTÓN CENTRAL PLAY/PAUSA
    ================================= */
    .control-center {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .cyber-play-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cyber-play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.8);
    }

    .cyber-play-btn svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
    }

    .footer-text {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
