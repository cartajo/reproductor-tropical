<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Flow Radio TV</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #00695c, #ff9800);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player {
            width: 350px;
            padding: 25px;
            border-radius: 25px;
            background: rgba(0, 0, 0, .75);
            color: white;
            text-align: center;
            box-shadow: 0 0 25px #000;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        /* Módulo del reloj estilizado */
        .reloj {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            color: #ff9800;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }
        .live {
            margin: 15px 0;
            color: #ff3333;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            animation: parpadeo 1.5s infinite;
        }
        /* Animación para el indicador EN VIVO */
        @keyframes parpadeo {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        /* Contenedor adaptado para el reproductor de Caster */
        .contenedor-caster {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Oculta enlaces redundantes del widget para mantener estética limpia */
        .cstrEmbed a {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="player">
        <div class="logo">
            🌴 Tropical Flow<br>
            📻 Radio TV
        </div>
        
        <!-- Reloj Digital Funcional -->
        <div class="reloj" id="reloj">00:00:00</div>

        <div class="live">🔴 EN VIVO</div>
        
        <!-- Widget Oficial de Transmisión de Caster.fm integrado -->
        <div class="contenedor-caster">
            <div class="cstrEmbed" 
                 data-type="newStreamPlayer" 
                 data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" 
                 data-theme="dark" 
                 data-color="ff9800" 
                 data-channelId="" 
                 data-rendered="false">
                 <a href="https://www.caster.fm">Shoutcast Hosting</a>
            </div>
        </div>
    </div>

    <!-- Script oficial del Widget de Caster.fm -->
    <script src="https://caster.fm"></script>

    <script>
        // Lógica del Reloj en Tiempo Real (Formato 24 Horas)
        function actualizarReloj() {
            const tiempo = new Date();
            const horas = String(tiempo.getHours()).padStart(2, '0');
            const minutos = String(tiempo.getMinutes()).padStart(2, '0');
            const segundos = String(tiempo.getSeconds()).padStart(2, '0');
            document.getElementById('reloj').innerHTML = `${horas}:${minutos}:${segundos}`;
        }
        // Actualiza el contenedor cada segundo
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>
</html>
