<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Flow Radio TV</title>
    <style>
        /* Configuración base del cuerpo de la página */
        body {
            margin: 0;
            background: linear-gradient(135deg, #00695c, #ff9800);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contenedor principal del reproductor */
        .player {
            width: 350px;
            padding: 25px;
            border-radius: 25px;
            background: rgba(0, 0, 0, .75);
            color: white;
            text-align: center;
            box-shadow: 0 0 25px #000;
        }

        /* Estilo del título/logotipo */
        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Reloj digital estilizado en color naranja */
        .reloj {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            color: #ff9800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
        }

        /* Etiqueta de transmisión en vivo con efecto intermitente */
        .live {
            margin: 15px 0;
            color: #ff3333;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            animation: parpadeo 1.5s infinite;
        }

        /* Animación para hacer parpadear el indicador en vivo */
        @keyframes parpadeo {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Contenedor adaptado para forzar que el botón de Caster sea visible */
        .contenedor-caster {
            margin-top: 20px;
            min-height: 110px; /* Tamaño mínimo garantizado para el botón y metadatos */
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Ajuste de ancho completo para el widget inyectado */
        .cstrEmbed {
            width: 100%;
        }

        /* Oculta los enlaces de texto redundantes debajo del botón oficial */
        .cstrEmbed a {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="player">
        <!-- Logotipo de la Estación -->
        <div class="logo">
            🌴 Tropical Flow<br>
            📻 Radio TV
        </div>
        
        <!-- Pantalla del Reloj Digital (Actualizado por JavaScript) -->
        <div class="reloj" id="reloj">00:00:00 AM</div>

        <!-- Indicador de señal activa -->
        <div class="live">🔴 EN VIVO</div>
        
        <!-- Bloque donde se genera el reproductor oficial de Caster.fm -->
        <div class="contenedor-caster">
            <div class="cstrEmbed" 
                 data-type="newStreamPlayer" 
                 data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" 
                 data-theme="dark" 
                 data-color="ff9800" 
                 data-channelId="" 
                 data-rendered="false">
                 <a href="https://www.caster.fm">Shoutcast Hosting</a>
            </div>
        </div>
    </div>

    <!-- Script Oficial de Caster que dibuja los botones y activa el streaming -->
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

    <script>
        // Lógica para el cálculo del Reloj en formato estándar de 12 Horas (AM/PM)
        function actualizarReloj() {
            const tiempoActual = new Date();
            let horas = tiempoActual.getHours();
            const minutos = String(tiempoActual.getMinutes()).padStart(2, '0');
            const segundos = String(tiempoActual.getSeconds()).padStart(2, '0');
            
            // Determina si es AM o PM antes de transformar la hora
            const indicadorAmPm = horas >= 12 ? 'PM' : 'AM';
            
            // Transforma el formato militar (0-23) al formato estándar de 12 horas
            horas = horas % 12;
            horas = horas ? horas : 12; // Si la hora es 0 (medianoche), la transforma en 12
            const horasFormateadas = String(horas).padStart(2, '0');
            
            // Inyecta el resultado final en la interfaz gráfica
            document.getElementById('reloj').innerHTML = `${horasFormateadas}:${minutos}:${segundos} ${indicadorAmPm}`;
        }

        // Ejecuta el reloj de forma continua cada 1 segundo (1000 milisegundos)
        setInterval(actualizarReloj, 1000);
        
        // Ejecución inmediata inicial para evitar el parpadeo de "00:00:00" al cargar la web
        actualizarReloj();
    </script>

</body>
</html>
