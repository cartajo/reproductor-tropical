<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV - Player</title>
</head>
<body>

<!-- Contenedor Principal del Reproductor Profesional -->
<div class="tropical-player-card">
  <!-- Encabezado con Info de la Estación -->
  <div class="player-header">
    <div class="station-logo">🥭</div>
    <div class="station-info">
      <h3>Tropical Flow Radio TV</h3>
      <p class="status-tag"><span class="live-dot" id="liveDot"></span> <span id="statusText">EN VIVO</span></p>
    </div>
  </div>

  <!-- Ecualizador Animado Visual -->
  <div class="equalizer-container" id="eqContainer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Controles de Audio -->
  <div class="player-controls">
    <button id="playBtn" class="play-button" aria-label="Reproducir">
      <!-- Icono de Play SVG dinámico -->
      <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="white">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    
    <!-- Control de Volumen Deslizante -->
    <div class="volume-container">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="#a855f7">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="volume-slider">
    </div>
  </div>

  <!-- CAMBIA ESTA URL POR TU URL DE TRANSMISIÓN DIRECTA (Ej: http://caster.fm:XXXX/listen.mp3) -->
  <audio id="radioStream" src="https://shaincast.caster.fm:XXXX/listen.mp3" preload="none" crossorigin="anonymous"></audio>
</div>

<!-- Estilos Visuales del Reproductor (CSS) -->
<style>
  body {
    background-color: #0b0713;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .tropical-player-card {
    background: linear-gradient(135deg, #120c1f 0%, #1a103c 100%);
    border: 2px solid #6c2bdd;
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 15px 35px rgba(108, 43, 221, 0.3);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    box-sizing: border-box;
  }

  .player-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .station-logo {
    background: #6c2bdd;
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 15px rgba(108, 43, 221, 0.6);
  }

  .station-info h3 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: linear-gradient(to right, #ffffff, #d8b4fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status-tag {
    margin: 4px 0 0 0;
    font-size: 0.75rem;
    color: #a855f7;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 1px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    background-color: #6b7280; /* Gris apagado por defecto */
    border-radius: 50%;
    display: inline-block;
    transition: all 0.3s ease;
  }

  .live-dot.active {
    background-color: #22c55e; /* Verde encendido al sonar */
    box-shadow: 0 0 8px #22c55e;
  }

  .equalizer-container {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 40px;
    margin-bottom: 25px;
  }

  .bar {
    width: 6px;
    height: 15%;
    background-color: #374151; /* Color apagado cuando está en pausa */
    border-radius: 3px;
    transition: all 0.3s ease;
  }

  .equalizer-container.playing .bar {
    animation: bounce 1.2s ease-in-out infinite alternate;
  }

  .equalizer-container.playing .bar:nth-child(1) { animation-delay: 0.1s; background-color: #6c2bdd; }
  .equalizer-container.playing .bar:nth-child(2) { animation-delay: 0.4s; background-color: #a855f7; }
  .equalizer-container.playing .bar:nth-child(3) { animation-delay: 0.2s; background-color: #ec4899; }
  .equalizer-container.playing .bar:nth-child(4) { animation-delay: 0.6s; background-color: #f43f5e; }
  .equalizer-container.playing .bar:nth-child(5) { animation-delay: 0.3s; background-color: #ec4899; }
  .equalizer-container.playing .bar:nth-child(6) { animation-delay: 0.5s; background-color: #a855f7; }
  .equalizer-container.playing .bar:nth-child(7) { animation-delay: 0.1s; background-color: #6c2bdd; }
  .equalizer-container.playing .bar:nth-child(8) { animation-delay: 0.7s; background-color: #a855f7; }

  @keyframes bounce {
    0% { height: 15%; }
    10% { height: 35%; }
    30% { height: 100%; }
    60% { height: 50%; }
    80% { height: 85%; }
    100% { height: 20%; }
  }

  .player-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .play-button {
    background: #6c2bdd;
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(108, 43, 221, 0.4);
  }

  .play-button:hover {
    background: #a855f7;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-grow: 1;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 15px;
    border-radius: 30px;
  }

  .volume-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: #374151;
    border-radius: 5px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
    transition: background 0.15s;
  }

  .volume-slider::-webkit-slider-thumb:hover {
    background: #a855f7;
  }
</style>

<!-- Lógica del Reproductor (JavaScript) -->
<script>
  const audio = document.getElementById('radioStream');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const volumeSlider = document.getElementById('volumeSlider');
  const eqContainer = document.getElementById('eqContainer');
  const liveDot = document.getElementById('liveDot');
  const statusText = document.getElementById('statusText');

  // Guardamos las estructuras SVG exactas para alternar limpiamente
  const playSVG = '<path d="M8 5v14l11-7z"/>';
  const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  // Configurar volumen inicial
  audio.volume = volumeSlider.value;

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      // Truco vital para Radios en Vivo:
      // Forzamos la recarga del stream antes de reproducir para asegurar cero retrasos de caché.
      const currentSrc = audio.src;
      audio.src = '';
      audio.src = currentSrc;
      
      statusText.textContent = "CONECTANDO...";
      
      audio.play()
        .then(() => {
          playIcon.innerHTML = pauseSVG;
          eqContainer.classList.add('playing');
          liveDot.classList.add('active');
          statusText.textContent = "EN VIVO";
        })
        .catch(err => {
          console.error("Error al conectar con la transmisión:", err);
          statusText.textContent = "DESCONECTADO";
          resetPlayerUI();
        });
    } else {
      audio.pause();
      resetPlayerUI();
    }
  });

  // Evento para actualizar volumen en tiempo real
  volumeSlider.addEventListener('input', (e) => {
    audio.volume = e.target.value;
  });

  // Función auxiliar para limpiar la interfaz al pausar
  function resetPlayerUI() {
    playIcon.innerHTML = playSVG;
    eqContainer.classList.remove('playing');
    liveDot.classList.remove('active');
    if(statusText.textContent !== "DESCONECTADO") {
      statusText.textContent = "PAUSADO";
    }
  }
</script>

</body>
</html>
