<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV - Pro Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #06040d;
      background-image: radial-gradient(circle at center, #1b0d3a 0%, #06040d 100%);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; padding: 15px;
    }
    
    /* CONTENEDOR FUTURISTA CON BORDE ILUMINADO EXTREMO */
    .cyber-player-container {
      background: rgba(13, 8, 28, 0.95);
      border: 2px solid #a855f7;
      border-radius: 30px; width: 100%; max-width: 350px; padding: 30px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.2);
      text-align: center; position: relative; overflow: hidden;
    }
    
    .top-status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.04); padding: 10px 15px; border-radius: 15px; margin-bottom: 25px;
    }
    .clock-title { font-size: 9px; color: #a855f7; font-weight: 800; display: block; }
    .clock-num { font-size: 16px; color: #ffffff; font-weight: bold; font-family: monospace; }
    .badge-live { display: flex; align-items: center; gap: 6px; background: #000; padding: 6px 12px; border-radius: 20px; }
    .dot-signal { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; }
    .dot-signal.connecting { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; animation: neonPulse 0.8s infinite alternate; }
    .dot-signal.active { background-color: #10b981; box-shadow: 0 0 12px #10b981; animation: neonPulse 0.8s infinite alternate; }
    .text-signal { font-size: 10px; font-weight: 900; color: #9ca3af; }
    @keyframes neonPulse { from { opacity: 0.4; } to { opacity: 1; } }
    
    /* SECCIÓN DE IDENTIDAD CON PALMAS TROPICALES */
    .brand-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
    .brand-glow-icon {
      background: linear-gradient(135deg, #a855f7, #ec4899); width: 60px; height: 60px; min-width: 60px;
      border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
      animation: floatIcon 3s ease-in-out infinite alternate;
    }
    .brand-info h2 { margin: 0; font-size: 20px; color: #ffffff; letter-spacing: 0.5px; }
    .brand-info p { margin: 4px 0 0 0; font-size: 12px; color: #a855f7; font-weight: 600; }
    
    @keyframes floatIcon {
      from { transform: translateY(0px); }
      to { transform: translateY(-4px); }
    }

    /* SECCIÓN DE LA CANCIÓN ACTUAL (SISTEMA PROPIO REPARADO) */
    .song-metadata-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 20px;
      min-height: 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .song-title-label {
      font-size: 10px;
      color: #ec4899;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .song-now-playing {
      font-size: 13px;
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* ECUALIZADOR DINÁMICO IMPRESIONANTE (SIEMPRE ACTIVO) */
    .wave-equalizer {
      display: flex; align-items: flex-end; justify-content: space-between;
      height: 50px; padding: 0 15px; margin-bottom: 30px; background: rgba(0, 0, 0, 0.4); border-radius: 15px; overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .wave-bar { width: 4px; height: 12%; background-color: #2e1a4d; border-radius: 3px 3px 0 0; }
    
    /* Animación constante del ecualizador para dar ambiente musical */
    .wave-equalizer .wave-bar { animation: proBounce 0.7s ease-in-out infinite alternate; }
    .wave-equalizer .wave-bar:nth-child(even) { background-color: #ec4899; animation-duration: 0.5s; }
    .wave-equalizer .wave-bar:nth-child(3n) { background-color: #a855f7; animation-duration: 0.9s; }
    .wave-equalizer .wave-bar:nth-child(5n) { background-color: #3b82f6; animation-duration: 0.6s; }
    @keyframes proBounce { 0% { height: 15%; } 100% { height: 95%; } }
    
    /* BOTÓN INTERACTIVO */
    .control-center { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
    .cyber-play-btn {
      width: 85px; height: 85px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6), 0 0 30px rgba(99, 102, 241, 0.2); cursor: pointer;
      transition: all 0.3s ease;
    }
    .cyber-play-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(168, 85, 247, 0.8); }
    .cyber-play-btn:active { transform: scale(0.95); }
    .cyber-play-btn svg { width: 34px; height: 34px; fill: #ffffff; }

    .footer-text { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  <div class="cyber-player-container">
    <!-- BARRA SUPERIOR -->
    <div class="top-status-bar">
      <div>
        <span class="clock-title">ESTACIÓN ACTIVA</span>
        <span id="player-clock" class="clock-num">00:00:00</span>
      </div>
      <div class="badge-live">
        <div id="signal-dot" class="dot-signal"></div>
        <span id="signal-text" class="text-signal">OFFLINE</span>
      </div>
    </div>

    <!-- IDENTIDAD DE LA EMISORA -->
    <div class="brand-section">
      <div class="brand-glow-icon">🌴</div>
      <div class="brand-info">
        <h2>Tropical Flow Radio</h2>
        <p>Señal Digital desde Puerto Rico</p>
      </div>
    </div>

    <!-- CAJA METADATOS REPARADA -->
    <div class="song-metadata-box">
      <span class="song-title-label">Sintonizando Ahora</span>
      <div id="current-track-name" class="song-now-playing">Tropical Flow Radio TV</div>
    </div>

    <!-- ECUALIZADOR VISUAL -->
    <div id="player-eq" class="wave-equalizer">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- ELEMENTO DE AUDIO OCULTO -->
    <audio id="core-audio" preload="none"></audio>

    <!-- CONTROL CENTRAL -->
    <div class="control-center">
      <button id="master-btn" class="cyber-play-btn" onclick="startCyberStream()">
        <svg id="icon-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="footer-text">AUDIO EN VIVO • TROPICAL FLOW RADIO TV</div>
  </div>
  <script>
    // Sincronización del reloj local
    function initClock() {
      document.getElementById('player-clock').innerText = new Date().toLocaleTimeString();
    }
    setInterval(initClock, 1000);
    initClock();

       // Variables de control del sistema de audio
const audioPlayer = document.getElementById('core-audio');
const iconSvg = document.getElementById('icon-svg');
const signalDot = document.getElementById('signal-dot');
const signalText = document.getElementById('signal-text');
const trackNameContainer = document.getElementById('current-track-name');

// Configuración de rutas y metadatos
const streamRoutes = [
  "https://caster.fm", // Ruta directa corregida para streaming Icecast/Shoutcast
  "https://sapircast.caster.fm:16693/kidAJ",
  "https://djoeantonio.ismyradio.com"
];
let currentRouteIndex = 0;
let metadataInterval = null;

// Sincronización del reloj local
function initClock() {
  document.getElementById('player-clock').innerText = new Date().toLocaleTimeString();
}
setInterval(initClock, 1000);
initClock();

// FUNCIÓN PARA OBTENER EL NOMBRE DE LA CANCIÓN DESDE CASTER.FM
async function updateTrackName() {
  const publicToken = "fdc37ef9-203f-4198-b246-17087ecdb02d";
  // Usamos el proxy oficial de caster o un servicio proxy para evitar problemas de CORS en entornos locales
  const apiUrl = `https://caster.fm{publicToken}`;

  try {
    const response = await fetch(apiUrl);
    if (!response.ok) throw new Error("Error en la respuesta del servidor");
    
    const data = await response.json();
    
    // Validamos que exista la propiedad del título de la canción en la respuesta de Caster.fm
    if (data && data.title) {
      trackNameContainer.innerText = data.title;
    } else if (data && data.song) {
      trackNameContainer.innerText = data.song;
    } else {
      trackNameContainer.innerText = "Tropical Flow Radio TV";
    }
  } catch (error) {
    console.error("Error al obtener los metadatos:", error);
    // En caso de fallo de red, dejamos el nombre de la emisora por defecto
    if(trackNameContainer.innerText === "Cargando...") {
      trackNameContainer.innerText = "Tropical Flow Radio TV";
    }
  }
}

// Controladores del flujo de Audio
function startCyberStream() {
  if (audioPlayer.paused) {
    signalDot.className = "dot-signal connecting";
    signalText.innerText = "CONECTANDO";
    trackNameContainer.innerText = "Cargando...";
    currentRouteIndex = 0;
    tryRoute();
  } else {
    stopCyberStream();
  }
}

function stopCyberStream() {
  audioPlayer.pause();
  audioPlayer.src = ""; // Corta la descarga del stream inmediatamente
  
  signalDot.className = "dot-signal";
  signalText.innerText = "OFFLINE";
  trackNameContainer.innerText = "Tropical Flow Radio TV";
  iconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Icono de Play
  
  // Limpiamos el intervalo para no consumir datos innecesarios si está en pausa
  clearInterval(metadataInterval);
}

function tryRoute() {
  if (currentRouteIndex >= streamRoutes.length) {
    signalDot.className = "dot-signal";
    signalText.innerText = "ERROR DE SEÑAL";
    trackNameContainer.innerText = "Transmisión no disponible";
    return;
  }

  audioPlayer.src = streamRoutes[currentRouteIndex];
  
  audioPlayer.play()
    .then(() => {
      signalDot.className = "dot-signal active";
      signalText.innerText = "EN VIVO";
      iconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Icono de Pause
      
      // Iniciamos la actualización de canciones inmediatamente y luego cada 15 segundos
      updateTrackName();
      metadataInterval = setInterval(updateTrackName, 15000);
    })
    .catch(error => {
      console.warn(`Ruta ${currentRouteIndex} falló. Probando siguiente...`);
      currentRouteIndex++;
      tryRoute();
    });
}

    function stopCyberStream() {
      audioPlayer.pause();
      audioPlayer.src = "";
      signalDot.className = "dot-signal";
      signalText.innerText = "OFFLINE";
      iconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

  </script>
</body>
</html>
