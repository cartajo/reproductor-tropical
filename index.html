<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Flow Radio TV - Premium Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      background-color: #05020a;
      background-image: radial-gradient(circle at center, #160b2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .premium-player-dashboard {
      background: #0d081b;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(108, 43, 221, 0.15);
    }

    .dashboard-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }

    .system-clock-container {
      display: flex;
      flex-direction: column;
    }

    .clock-label {
      font-size: 0.6rem;
      color: #a855f7;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .clock-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .live-badge-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .live-dot.connecting {
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    .live-dot.active {
      background-color: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: pulse 1s infinite alternate;
    }

    .status-text {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #9ca3af;
    }

    .station-hero-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand-avatar {
      background: linear-gradient(135deg, #6c2bdd 0%, #ec4899 100%);
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(108, 43, 221, 0.4);
    }

    .brand-details h2 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    .sub-freq {
      margin: 4px 0 0 0;
      font-size: 0.8rem;
      color: #a855f7;
      font-weight: 500;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .metric-title {
      font-size: 0.6rem;
      color: #6b7280;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e5e7eb;
      font-family: 'Courier New', Courier, monospace;
    }
    .pro-equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 50px;
      padding: 0 10px;
      margin-bottom: 28px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border-bottom: 2px solid rgba(168, 85, 247, 0.2);
    }

    .eq-bar {
      width: 6px;
      height: 10%;
      background-color: #272136;
      border-radius: 3px 3px 0 0;
      transition: all 0.3s ease;
    }

    .pro-equalizer.playing .eq-bar {
      animation: bouncePro 1s ease-in-out infinite alternate;
    }

    .pro-equalizer.playing .eq-bar:nth-child(2n) { animation-delay: 0.2s; background-color: #a855f7; }
    .pro-equalizer.playing .eq-bar:nth-child(3n) { animation-delay: 0.5s; background-color: #ec4899; }
    .pro-equalizer.playing .eq-bar:nth-child(4n) { animation-delay: 0.1s; background-color: #6c2bdd; }
    .pro-equalizer.playing .eq-bar:nth-child(5n) { animation-delay: 0.7s; background-color: #f43f5e; }

    @keyframes bouncePro {
      0% { height: 10%; }
      50% { height: 95%; }
      100% { height: 25%; }
    }

    @keyframes pulse {
      from { opacity: 0.5; } to { opacity: 1; }
    }

    .master-audio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .play-trigger-container {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .master-play-btn {
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #6c2bdd 0%, #a855f7 100%);
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(108, 43, 221, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .master-play-btn svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .hidden-caster-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 64px;
      height: 64px;
      opacity: 0.001;
      z-index: 10;
      cursor: pointer;
      overflow: hidden;
    }

    .hidden-caster-layer div, .hidden-caster-layer iframe {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<div class="premium-player-dashboard">
  
  <div class="dashboard-top-bar">
    <div class="system-clock-container">
      <span class="clock-label">ESTUDIO HORA:</span>
      <span id="studioClock" class="clock-display">00:00:00</span>
    </div>
    <div class="live-badge-wrapper">
      <span class="live-dot" id="liveDot"></span>
      <span id="statusText" class="status-text">OFFLINE</span>
    </div>
  </div>

  <div class="station-hero-card">
    <div class="brand-avatar">🥭</div>
    <div class="brand-details">
      <h2>Tropical Flow Radio TV</h2>
      <p class="sub-freq">Señal Digital desde Puerto Rico</p>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-box">
      <span class="metric-title">TIEMPO DE ESCUCHA</span>
      <span id="trackCounter" class="metric-value">00:00</span>
    </div>
    <div class="metric-box">
      <span class="metric-title">CALIDAD DE AUDIO</span>
      <span class="metric-value">96 KBPS</span>
    </div>
  </div>

  <div class="pro-equalizer" id="eqContainer">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <div class="master-audio-controls">
    <div class="play-trigger-container" id="playZone">
      
      <button class="master-play-btn" id="playBtn" aria-label="Reproducir Transmisión">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <div class="hidden-caster-layer">
        <div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="fdc37ef9-203f-4198-b246-17087ecdb02d" data-theme="dark" data-color="6C2BDD" data-channelId="" data-rendered="false">
          <a href="https://caster.fm">Radio Hosting</a>
        </div>
        <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
      </div>

    </div>
  </div>

</div>

<script>
  const playZone = document.getElementById('playZone');
  const playIcon = document.getElementById('playIcon');
  const eqContainer = document.getElementById('eqContainer');
  const liveDot = document.getElementById('liveDot');
  const statusText = document.getElementById('statusText');
  const clockElement = document.getElementById('studioClock');
  const counterElement = document.getElementById('trackCounter');

  const playSVG = '<path d="M8 5v14l11-7z"/>';
  const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  let countInterval = null;
  let secondsListened = 0;
  let isPlaying = false;

  // 1. Reloj de Estudio Real (Formato 12H)
  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clockElement.textContent = `${String(h).padStart(2,'0')}:${m}:${s} ${ampm}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. Contador de Escucha
  function startCounter() {
    clearInterval(countInterval);
    countInterval = setInterval(() => {
      secondsListened++;
      const mins = String(Math.floor(secondsListened / 60)).padStart(2, '0');
      const secs = String(secondsListened % 60).padStart(2, '0');
      counterElement.textContent = `${mins}:${secs}`;
    }, 1000);
  }

  function stopCounter() {
    clearInterval(countInterval);
    secondsListened = 0;
    counterElement.textContent = "00:00";
  }

  // 3. Control Sincronizado al dar Toque
  playZone.addEventListener('click', () => {
    isPlaying = !isPlaying;
    
    if (isPlaying) {
      statusText.textContent = "CONECTANDO";
      liveDot.className = "live-dot connecting";
      
      setTimeout(() => {
        if(isPlaying) {
          playIcon.innerHTML = pauseSVG;
          eqContainer.classList.add('playing');
          liveDot.className = "live-dot active";
          statusText.textContent = "EN VIVO";
          startCounter();
        }
      }, 1500);
      
    } else {
      stopCounter();
      playIcon.innerHTML = playSVG;
      eqContainer.classList.remove('playing');
      liveDot.className = "live-dot";
      statusText.textContent = "OFFLINE";
    }
  });
</script>
</body>
</html>
