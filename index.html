<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tropical Flow Radio TV</title>

<style>

body{
    margin:0;
    background:linear-gradient(135deg,#00695c,#ff9800);
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}


.player{
    width:350px;
    padding:25px;
    border-radius:25px;
    background:rgba(0,0,0,.65);
    color:white;
    text-align:center;
    box-shadow:0 0 25px #000;
}


.logo{
    font-size:28px;
    font-weight:bold;
}


.live{
    margin:15px;
    color:red;
    font-weight:bold;
}


button{
    border:none;
    border-radius:50%;
    width:70px;
    height:70px;
    font-size:30px;
    cursor:pointer;
    background:#ff9800;
    color:white;
}


.volume{
    width:100%;
    margin-top:25px;
}


input[type=range]{
    width:100%;
}


.status{
    margin-top:15px;
    font-size:14px;
}

</style>

</head>


<body>


<div class="player">

<div class="logo">
🌴 Tropical Flow<br>
📻 Radio TV
</div>


<div class="live">
🔴 EN VIVO
</div>


<button onclick="playRadio()" id="play">
▶
</button>


<br>


<input 
class="volume"
id="volume"
type="range"
min="0"
max="1"
step="0.01"
value="0.8">


<div class="status" id="status">
Desconectado
</div>


<audio id="radio">

<source 
src="http://sapircast.caster.fm:16693/kidAJ"
type="audio/mpeg">

</audio>


</div>



<script>


let radio=document.getElementById("radio");
let btn=document.getElementById("play");
let vol=document.getElementById("volume");
let status=document.getElementById("status");


radio.volume=0.8;


function playRadio(){

if(radio.paused){

radio.play();

btn.innerHTML="⏸";

status.innerHTML="Conectado Tropical Flow 📻";

}

else{

radio.pause();

btn.innerHTML="▶";

status.innerHTML="Pausado";

}

}



vol.oninput=function(){

radio.volume=this.value;

}



radio.onerror=function(){

status.innerHTML="Error conectando al servidor";

}


</script>


</body>
</html>
